# Builds the Astro site and deploys it to GitHub Pages.
# Based on https://docs.astro.build/en/guides/deploy/github/
# Requires: Settings → Pages → Source = "GitHub Actions".
name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      # Installs from package-lock.json and runs `npm run build`
      # (astro check + astro build). Content schema errors or type errors fail this step.
      - name: Install, validate, build, and upload
        uses: withastro/action@v6
        with:
          node-version: 24

  deploy:
    # Pull requests are built and validated, but only main is deployed.
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
