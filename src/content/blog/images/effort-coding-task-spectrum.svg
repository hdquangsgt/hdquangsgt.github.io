<svg xmlns="http://www.w3.org/2000/svg" width="720" height="420" viewBox="0 0 720 420" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="15">
  <style>
    .bg { fill: var(--color-bg, #ffffff); }
    .box { fill: #f5f5f2; stroke: #8a9099; stroke-width: 1.4; }
    .core { fill: #e9f5f0; stroke: #0b6b52; stroke-width: 1.8; }
    .obs { fill: #edf3fc; stroke: #1f5fbf; stroke-width: 1.8; }
    .ext { fill: #f4eefb; stroke: #7a3fb8; stroke-width: 1.8; }
    .os { fill: #fcefea; stroke: #a33f1c; stroke-width: 1.8; }
    .hyp { fill: none; stroke: #8a9099; stroke-width: 1.6; stroke-dasharray: 6 4; }
    .zone { fill: none; stroke: #8a9099; stroke-width: 1.3; stroke-dasharray: 3 4; }
    .band { fill: #f1efe8; stroke: #c9c5b8; stroke-width: 1; }
    .band2 { fill: #ecf1f8; stroke: #b9c6da; stroke-width: 1; }
    .t { fill: var(--color-text, #1d1f22); }
    .m { fill: var(--color-text-muted, #595f67); }
    .good { fill: #0b6b52; }
    .bad { fill: #a33f1c; }
    .h { font-weight: 700; }
    .l { font-size: 18px; }
    .s { font-size: 13px; }
    .mono { font-family: ui-monospace, Menlo, Consolas, monospace; font-size: 14px; }
    .line { stroke: var(--color-text-muted, #595f67); stroke-width: 1.8; fill: none; }
    .thick { stroke: #0b6b52; stroke-width: 4; fill: none; }
    .thin { stroke: var(--color-text-muted, #595f67); stroke-width: 1.4; fill: none; }
    .dash { stroke: var(--color-text-muted, #595f67); stroke-width: 1.6; fill: none; stroke-dasharray: 5 4; }
    .flow { stroke: #0b6b52; stroke-width: 2.4; fill: none; }
    .loop { stroke: #0b6b52; stroke-width: 2.4; fill: none; stroke-dasharray: 7 5; }
    .redline { stroke: #a33f1c; stroke-width: 1.8; fill: none; stroke-dasharray: 5 4; }
    .arrow { fill: var(--color-text-muted, #595f67); }
    .arrowg { fill: #0b6b52; }
    .arrowr { fill: #a33f1c; }
    .dot { fill: #0b6b52; }
    .dotm { fill: var(--color-text-muted, #595f67); }
    .ring { fill: var(--color-bg, #ffffff); stroke: var(--color-text, #1d1f22); stroke-width: 2; }
    .sq { fill: var(--color-text, #1d1f22); }
    @media (prefers-color-scheme: dark) {
      .bg { fill: var(--color-bg, #121416); }
      .box { fill: #1a1d20; stroke: #6b737c; }
      .core { fill: #13291f; stroke: #6fd3ae; }
      .obs { fill: #17233a; stroke: #8ab6ff; }
      .ext { fill: #241b33; stroke: #c6a2f5; }
      .os { fill: #301c15; stroke: #f3a184; }
      .hyp { stroke: #8a929b; }
      .zone { stroke: #6b737c; }
      .band { fill: #1b1c19; stroke: #3a3a35; }
      .band2 { fill: #171d27; stroke: #2d3a50; }
      .t { fill: var(--color-text, #e4e6e8); }
      .m { fill: var(--color-text-muted, #a2a9b1); }
      .good { fill: #6fd3ae; }
      .bad { fill: #f3a184; }
      .thick { stroke: #6fd3ae; }
      .thin, .line, .dash { stroke: var(--color-text-muted, #a2a9b1); }
      .flow { stroke: #6fd3ae; }
      .loop { stroke: #6fd3ae; }
      .redline { stroke: #f3a184; }
      .arrow { fill: var(--color-text-muted, #a2a9b1); }
      .arrowg { fill: #6fd3ae; }
      .arrowr { fill: #f3a184; }
      .dot { fill: #6fd3ae; }
      .dotm { fill: var(--color-text-muted, #a2a9b1); }
      .ring { fill: var(--color-bg, #121416); stroke: var(--color-text, #e4e6e8); }
      .sq { fill: var(--color-text, #e4e6e8); }
    }
  </style>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="arrow"/></marker>
    <marker id="ag" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="arrowg"/></marker>
    <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="arrowr"/></marker>
  </defs>
  <rect class="bg" width="720" height="420"/>
  <text x="20" y="28" text-anchor="start" class="t h">Reasoning needs tend to grow with coupling, uncertainty and consequence</text>
  <path class="line" d="M24 62 L696 62" marker-end="url(#a)"/>
  <text x="24" y="50" text-anchor="start" class="m s">narrow, local</text>
  <text x="696" y="50" text-anchor="end" class="m s">broad, uncertain</text>
  <rect class="core" x="20" y="90" width="210" height="230" rx="8"/>
  <text x="36" y="118" text-anchor="start" class="t h">1 · Rename a</text>
  <text x="36" y="138" text-anchor="start" class="t h">local variable</text>
  <text x="36" y="172" text-anchor="start" class="m s">• scope-aware rename</text>
  <text x="36" y="196" text-anchor="start" class="m s">• compiler stays happy</text>
  <text x="36" y="220" text-anchor="start" class="m s">• tests unchanged</text>
  <rect class="obs" x="255" y="90" width="210" height="230" rx="8"/>
  <text x="271" y="118" text-anchor="start" class="t h">2 · Refactor</text>
  <text x="271" y="138" text-anchor="start" class="t h">auth middleware</text>
  <text x="271" y="172" text-anchor="start" class="m s">• caller dependencies</text>
  <text x="271" y="196" text-anchor="start" class="m s">• security implications</text>
  <text x="271" y="220" text-anchor="start" class="m s">• backward compatibility</text>
  <text x="271" y="244" text-anchor="start" class="m s">• test coverage</text>
  <rect class="os" x="490" y="90" width="210" height="230" rx="8"/>
  <text x="506" y="118" text-anchor="start" class="t h">3 · Investigate a</text>
  <text x="506" y="138" text-anchor="start" class="t h">post-deploy regression</text>
  <text x="506" y="172" text-anchor="start" class="m s">• code diffs</text>
  <text x="506" y="196" text-anchor="start" class="m s">• logs and errors</text>
  <text x="506" y="220" text-anchor="start" class="m s">• test results</text>
  <text x="506" y="244" text-anchor="start" class="m s">• recent changes</text>
  <rect class="box" x="20" y="344" width="680" height="56" rx="8"/>
  <text x="360" y="367.5" text-anchor="middle" class="t h">No effort level is universally right for a category</text>
  <text x="360" y="386.5" text-anchor="middle" class="m s">Treat the spectrum as a starting hypothesis and measure on your own tasks.</text>
</svg>
