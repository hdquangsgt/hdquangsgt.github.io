<svg xmlns="http://www.w3.org/2000/svg" width="720" height="360" viewBox="0 0 720 360" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="13">
  <style>
    .bg { fill: var(--color-bg, #ffffff); }
    .box { fill: #f5f5f2; stroke: #8a9099; stroke-width: 1.2; }
    .core { fill: #e9f5f0; stroke: #0b6b52; stroke-width: 1.5; }
    .store { fill: #eaf1fb; stroke: #1f5fae; stroke-width: 1.5; }
    .bad { fill: #fcefea; stroke: #a33f1c; stroke-width: 1.5; }
    .t { fill: var(--color-text, #1d1f22); }
    .m { fill: var(--color-text-muted, #595f67); }
    .h { font-weight: 700; }
    .s { font-size: 11.5px; }
    .mono { font-family: ui-monospace, Menlo, Consolas, monospace; font-size: 12px; }
    .line { stroke: var(--color-text-muted, #595f67); stroke-width: 1.4; fill: none; }
    .dash { stroke: var(--color-text-muted, #595f67); stroke-width: 1.2; fill: none; stroke-dasharray: 4 3; }
    .redline { stroke: #a33f1c; stroke-width: 1.6; fill: none; }
    .arrow { fill: var(--color-text-muted, #595f67); }
    @media (prefers-color-scheme: dark) {
      .bg { fill: var(--color-bg, #121416); }
      .box { fill: #1a1d20; stroke: #6b737c; }
      .core { fill: #13291f; stroke: #6fd3ae; }
      .store { fill: #14233a; stroke: #8db8f0; }
      .bad { fill: #301c15; stroke: #f3a184; }
      .t { fill: var(--color-text, #e4e6e8); }
      .m { fill: var(--color-text-muted, #a2a9b1); }
      .line, .dash { stroke: var(--color-text-muted, #a2a9b1); }
      .redline { stroke: #f3a184; }
      .arrow { fill: var(--color-text-muted, #a2a9b1); }
    }
  </style>
  <defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="arrow"/></marker></defs>
  <rect class="bg" width="720" height="360"/>
  <text x="16" y="24" class="t h">Traditional agent</text>
  <text x="376" y="24" class="t h">Durable agent</text>
  <path class="dash" d="M360 12 V348"/>
  <rect class="box" x="16" y="40" width="328" height="40" rx="6"/>
  <text class="t h s" x="180.0" y="64.0" text-anchor="middle">Process memory</text>
  <rect class="box" x="16" y="96" width="328" height="40" rx="6"/>
  <text class="t h s" x="180.0" y="120.0" text-anchor="middle">request → model → tool → result → model</text>
  <rect class="box" x="16" y="152" width="328" height="40" rx="6"/>
  <text class="t h s" x="180.0" y="176.0" text-anchor="middle">Transcript maybe saved; loop state is not</text>
  <rect class="bad" x="16" y="208" width="328" height="40" rx="6"/>
  <text class="t h s" x="180.0" y="232.0" text-anchor="middle">CRASH</text>
  <rect class="bad" x="16" y="264" width="328" height="70" rx="6"/>
  <text class="t h s" x="180.0" y="283" text-anchor="middle">Restart from scratch or guess</text>
  <text class="m s" x="180.0" y="300" text-anchor="middle">repeated model calls · possible duplicate side effects</text>
  <text class="m s" x="180.0" y="314" text-anchor="middle">unknown which tools finished</text>
  <path class="line" d="M180 80 V96" marker-end="url(#a)"/>
  <path class="line" d="M180 136 V152" marker-end="url(#a)"/>
  <path class="line" d="M180 192 V208" marker-end="url(#a)"/>
  <path class="line" d="M180 248 V264" marker-end="url(#a)"/>
  <rect class="box" x="376" y="40" width="328" height="40" rx="6"/>
  <text class="t h s" x="540.0" y="64.0" text-anchor="middle">Process (replaceable)</text>
  <rect class="box" x="376" y="96" width="328" height="40" rx="6"/>
  <text class="t h s" x="540.0" y="120.0" text-anchor="middle">request → model → tool → result → model</text>
  <rect class="store" x="376" y="152" width="328" height="40" rx="6"/>
  <text class="t h s" x="540.0" y="176.0" text-anchor="middle">Every step committed to storage first</text>
  <rect class="bad" x="376" y="208" width="328" height="40" rx="6"/>
  <text class="t h s" x="540.0" y="232.0" text-anchor="middle">CRASH</text>
  <rect class="core" x="376" y="264" width="328" height="70" rx="6"/>
  <text class="t h s" x="540.0" y="283" text-anchor="middle">New process reopens storage</text>
  <text class="m s" x="540.0" y="300" text-anchor="middle">committed work kept · unfinished tasks resumed</text>
  <text class="m s" x="540.0" y="314" text-anchor="middle">unsafe tool calls reported as interrupted</text>
  <path class="line" d="M540 80 V96" marker-end="url(#a)"/>
  <path class="line" d="M540 136 V152" marker-end="url(#a)"/>
  <path class="line" d="M540 192 V208" marker-end="url(#a)"/>
  <path class="line" d="M540 248 V264" marker-end="url(#a)"/>
</svg>
