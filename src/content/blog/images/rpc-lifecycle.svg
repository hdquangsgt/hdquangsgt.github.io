<svg xmlns="http://www.w3.org/2000/svg" width="720" height="384" viewBox="0 0 720 384" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="13">
  <style>
    .bg { fill: var(--color-bg, #ffffff); }
    .box { fill: #f5f5f2; stroke: #8a9099; stroke-width: 1.2; }
    .core { fill: #e9f5f0; stroke: #0b6b52; stroke-width: 1.5; }
    .gdash { fill: none; stroke: #0b6b52; stroke-width: 1.5; stroke-dasharray: 6 4; }
    .ext { fill: #f4eefb; stroke: #7a3fb8; stroke-width: 1.5; }
    .os { fill: #fcefea; stroke: #a33f1c; stroke-width: 1.5; }
    .none { fill: none; stroke: #8a9099; stroke-width: 1.2; stroke-dasharray: 4 4; }
    .frame { fill: none; stroke: #b4b9bf; stroke-width: 1; stroke-dasharray: 3 3; }
    .t { fill: var(--color-text, #1d1f22); }
    .m { fill: var(--color-text-muted, #595f67); }
    .h { font-weight: 700; }
    .s { font-size: 11.5px; }
    .mono { font-family: ui-monospace, Menlo, Consolas, monospace; font-size: 12px; }
    .line { stroke: var(--color-text-muted, #595f67); stroke-width: 1.4; fill: none; }
    .dash { stroke: var(--color-text-muted, #595f67); stroke-width: 1.2; fill: none; stroke-dasharray: 4 3; }
    .arrow { fill: var(--color-text-muted, #595f67); }
    @media (prefers-color-scheme: dark) {
      .bg { fill: var(--color-bg, #121416); }
      .box { fill: #1a1d20; stroke: #6b737c; }
      .core { fill: #13291f; stroke: #6fd3ae; }
      .gdash { stroke: #6fd3ae; }
      .ext { fill: #241b33; stroke: #c6a2f5; }
      .os { fill: #301c15; stroke: #f3a184; }
      .none { stroke: #6b737c; }
      .frame { stroke: #4a5159; }
      .t { fill: var(--color-text, #e4e6e8); }
      .m { fill: var(--color-text-muted, #a2a9b1); }
      .line, .dash { stroke: var(--color-text-muted, #a2a9b1); }
      .arrow { fill: var(--color-text-muted, #a2a9b1); }
    }
  </style>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" class="arrow"/>
    </marker>
  </defs>
  <rect class="bg" width="720" height="384"/>
  <rect class="box" x="60" y="12" width="140" height="32" rx="6"/>
  <text x="130.0" y="33.0" text-anchor="middle" class="t h">Your client</text>
  <rect class="core" x="500" y="12" width="180" height="32" rx="6"/>
  <text x="590.0" y="33.0" text-anchor="middle" class="t h mono">pi --mode rpc</text>
  <path class="dash" d="M130 46 V372"/>
  <path class="dash" d="M590 46 V372"/>
  <path class="line" d="M134 78 H586" marker-end="url(#a)"/>
  <text x="360.0" y="70" text-anchor="middle" class="t mono">prompt  {id: “1”}</text>
  <path class="line" d="M586 128 H134" marker-end="url(#a)"/>
  <text x="360.0" y="120" text-anchor="middle" class="t mono">response  {id: “1”, success: true}</text>
  <text x="360.0" y="144" text-anchor="middle" class="m s">accepted, queued or handled: not finished</text>
  <path class="line" d="M586 184 H134" marker-end="url(#a)"/>
  <text x="360.0" y="176" text-anchor="middle" class="t mono">message_update  (repeats while streaming)</text>
  <path class="line" d="M586 240 H134" marker-end="url(#a)"/>
  <text x="360.0" y="232" text-anchor="middle" class="t mono">agent_end</text>
  <text x="360.0" y="256" text-anchor="middle" class="m s">one run is over</text>
  <path class="line" d="M586 296 H134" marker-end="url(#a)"/>
  <text x="360.0" y="288" text-anchor="middle" class="m mono">compaction / retry events, maybe another run</text>
  <text x="360.0" y="312" text-anchor="middle" class="m s">optional: retry, recovery, steering, follow-up</text>
  <path class="line" d="M586 350 H134" marker-end="url(#a)"/>
  <text x="360.0" y="342" text-anchor="middle" class="t mono">agent_settled</text>
  <text x="360.0" y="366" text-anchor="middle" class="m s">Pi will not continue on its own</text>
</svg>
