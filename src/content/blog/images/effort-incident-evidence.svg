<svg xmlns="http://www.w3.org/2000/svg" width="720" height="520" viewBox="0 0 720 520" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="15">
  <style>
    .bg { fill: var(--color-bg, #ffffff); }
    .box { fill: #f5f5f2; stroke: #8a9099; stroke-width: 1.4; }
    .core { fill: #e9f5f0; stroke: #0b6b52; stroke-width: 1.8; }
    .obs { fill: #edf3fc; stroke: #1f5fbf; stroke-width: 1.8; }
    .ext { fill: #f4eefb; stroke: #7a3fb8; stroke-width: 1.8; }
    .os { fill: #fcefea; stroke: #a33f1c; stroke-width: 1.8; }
    .hyp { fill: none; stroke: #8a9099; stroke-width: 1.6; stroke-dasharray: 6 4; }
    .zone { fill: none; stroke: #8a9099; stroke-width: 1.3; stroke-dasharray: 3 4; }
    .band { fill: #f1efe8; stroke: #c9c5b8; stroke-width: 1; }
    .band2 { fill: #ecf1f8; stroke: #b9c6da; stroke-width: 1; }
    .t { fill: var(--color-text, #1d1f22); }
    .m { fill: var(--color-text-muted, #595f67); }
    .good { fill: #0b6b52; }
    .bad { fill: #a33f1c; }
    .h { font-weight: 700; }
    .l { font-size: 18px; }
    .s { font-size: 13px; }
    .mono { font-family: ui-monospace, Menlo, Consolas, monospace; font-size: 14px; }
    .line { stroke: var(--color-text-muted, #595f67); stroke-width: 1.8; fill: none; }
    .thick { stroke: #0b6b52; stroke-width: 4; fill: none; }
    .thin { stroke: var(--color-text-muted, #595f67); stroke-width: 1.4; fill: none; }
    .dash { stroke: var(--color-text-muted, #595f67); stroke-width: 1.6; fill: none; stroke-dasharray: 5 4; }
    .flow { stroke: #0b6b52; stroke-width: 2.4; fill: none; }
    .loop { stroke: #0b6b52; stroke-width: 2.4; fill: none; stroke-dasharray: 7 5; }
    .redline { stroke: #a33f1c; stroke-width: 1.8; fill: none; stroke-dasharray: 5 4; }
    .arrow { fill: var(--color-text-muted, #595f67); }
    .arrowg { fill: #0b6b52; }
    .arrowr { fill: #a33f1c; }
    .dot { fill: #0b6b52; }
    .dotm { fill: var(--color-text-muted, #595f67); }
    .ring { fill: var(--color-bg, #ffffff); stroke: var(--color-text, #1d1f22); stroke-width: 2; }
    .sq { fill: var(--color-text, #1d1f22); }
    @media (prefers-color-scheme: dark) {
      .bg { fill: var(--color-bg, #121416); }
      .box { fill: #1a1d20; stroke: #6b737c; }
      .core { fill: #13291f; stroke: #6fd3ae; }
      .obs { fill: #17233a; stroke: #8ab6ff; }
      .ext { fill: #241b33; stroke: #c6a2f5; }
      .os { fill: #301c15; stroke: #f3a184; }
      .hyp { stroke: #8a929b; }
      .zone { stroke: #6b737c; }
      .band { fill: #1b1c19; stroke: #3a3a35; }
      .band2 { fill: #171d27; stroke: #2d3a50; }
      .t { fill: var(--color-text, #e4e6e8); }
      .m { fill: var(--color-text-muted, #a2a9b1); }
      .good { fill: #6fd3ae; }
      .bad { fill: #f3a184; }
      .thick { stroke: #6fd3ae; }
      .thin, .line, .dash { stroke: var(--color-text-muted, #a2a9b1); }
      .flow { stroke: #6fd3ae; }
      .loop { stroke: #6fd3ae; }
      .redline { stroke: #f3a184; }
      .arrow { fill: var(--color-text-muted, #a2a9b1); }
      .arrowg { fill: #6fd3ae; }
      .arrowr { fill: #f3a184; }
      .dot { fill: #6fd3ae; }
      .dotm { fill: var(--color-text-muted, #a2a9b1); }
      .ring { fill: var(--color-bg, #121416); stroke: var(--color-text, #e4e6e8); }
      .sq { fill: var(--color-text, #e4e6e8); }
    }
  </style>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="arrow"/></marker>
    <marker id="ag" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="arrowg"/></marker>
    <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="arrowr"/></marker>
  </defs>
  <rect class="bg" width="720" height="520"/>
  <text x="200" y="24" text-anchor="start" class="t h">Hypotheses (unverified)</text>
  <text x="470" y="24" text-anchor="start" class="t h">Evidence (observed)</text>
  <rect class="os" x="20" y="190" width="150" height="70" rx="8"/>
  <text x="95" y="220.5" text-anchor="middle" class="t h">Symptom</text>
  <text x="95" y="239.5" text-anchor="middle" class="m s">intermittent HTTP 500</text>
  <rect class="hyp" x="200" y="40" width="190" height="60" rx="8"/>
  <text x="295" y="65.5" text-anchor="middle" class="t h">H1 · DB pool</text>
  <text x="295" y="84.5" text-anchor="middle" class="m s">exhausted</text>
  <path class="thin" d="M172 225 L198 70" marker-end="url(#a)"/>
  <rect class="obs" x="470" y="40" width="230" height="60" rx="8"/>
  <text x="585" y="65.5" text-anchor="middle" class="t h">DB wait p99 is normal</text>
  <text x="585" y="84.5" text-anchor="middle" class="m s">metrics dashboard</text>
  <path class="line" d="M392 70 L468 70" marker-end="url(#a)"/>
  <text x="430" y="62" text-anchor="middle" class="bad s h">✕ refutes</text>
  <rect class="hyp" x="200" y="130" width="190" height="60" rx="8"/>
  <text x="295" y="155.5" text-anchor="middle" class="t h">H2 · Upstream</text>
  <text x="295" y="174.5" text-anchor="middle" class="m s">timeouts</text>
  <path class="thin" d="M172 225 L198 160" marker-end="url(#a)"/>
  <rect class="obs" x="470" y="130" width="230" height="60" rx="8"/>
  <text x="585" y="155.5" text-anchor="middle" class="t h">Upstream calls succeed</text>
  <text x="585" y="174.5" text-anchor="middle" class="m s">distributed traces</text>
  <path class="line" d="M392 160 L468 160" marker-end="url(#a)"/>
  <text x="430" y="152" text-anchor="middle" class="bad s h">✕ refutes</text>
  <rect class="hyp" x="200" y="220" width="190" height="60" rx="8"/>
  <text x="295" y="245.5" text-anchor="middle" class="t h">H3 · Cache</text>
  <text x="295" y="264.5" text-anchor="middle" class="m s">stampede</text>
  <path class="thin" d="M172 225 L198 250" marker-end="url(#a)"/>
  <rect class="obs" x="470" y="220" width="230" height="60" rx="8"/>
  <text x="585" y="245.5" text-anchor="middle" class="t h">No miss spike at 500s</text>
  <text x="585" y="264.5" text-anchor="middle" class="m s">cache metrics</text>
  <path class="line" d="M392 250 L468 250" marker-end="url(#a)"/>
  <text x="430" y="242" text-anchor="middle" class="bad s h">✕ refutes</text>
  <rect class="hyp" x="200" y="310" width="190" height="60" rx="8"/>
  <text x="295" y="335.5" text-anchor="middle" class="t h">H4 · Old build</text>
  <text x="295" y="354.5" text-anchor="middle" class="m s">on one instance</text>
  <path class="thin" d="M172 225 L198 340" marker-end="url(#a)"/>
  <rect class="obs" x="470" y="310" width="230" height="60" rx="8"/>
  <text x="585" y="335.5" text-anchor="middle" class="t h">500s only on instance 3</text>
  <text x="585" y="354.5" text-anchor="middle" class="m s">access logs</text>
  <path class="line" d="M392 340 L468 340" marker-end="url(#a)"/>
  <text x="430" y="332" text-anchor="middle" class="good s h">✓ supports</text>
  <path class="flow" d="M585 372 L585 392" marker-end="url(#ag)"/>
  <rect class="core" x="470" y="394" width="230" height="62" rx="8"/>
  <text x="585" y="420.5" text-anchor="middle" class="t h">Verified fix</text>
  <text x="585" y="439.5" text-anchor="middle" class="m s">roll back instance 3; 500s stop</text>
  <rect class="os" x="20" y="394" width="430" height="62" rx="8"/>
  <text x="235" y="420.5" text-anchor="middle" class="t h">Missing logs from instance 5?</text>
  <text x="235" y="439.5" text-anchor="middle" class="m s">Reasoning cannot replace evidence nobody collected.</text>
  <text x="20" y="494" text-anchor="start" class="m s">Solid blue = observed evidence. Dashed = hypothesis not yet verified.</text>
</svg>
