<svg xmlns="http://www.w3.org/2000/svg" width="720" height="430" viewBox="0 0 720 430" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="15">
  <style>
    .bg { fill: var(--color-bg, #ffffff); }
    .box { fill: #f5f5f2; stroke: #8a9099; stroke-width: 1.4; }
    .core { fill: #e9f5f0; stroke: #0b6b52; stroke-width: 1.8; }
    .obs { fill: #edf3fc; stroke: #1f5fbf; stroke-width: 1.8; }
    .ext { fill: #f4eefb; stroke: #7a3fb8; stroke-width: 1.8; }
    .os { fill: #fcefea; stroke: #a33f1c; stroke-width: 1.8; }
    .hyp { fill: none; stroke: #8a9099; stroke-width: 1.6; stroke-dasharray: 6 4; }
    .zone { fill: none; stroke: #8a9099; stroke-width: 1.3; stroke-dasharray: 3 4; }
    .band { fill: #f1efe8; stroke: #c9c5b8; stroke-width: 1; }
    .band2 { fill: #ecf1f8; stroke: #b9c6da; stroke-width: 1; }
    .t { fill: var(--color-text, #1d1f22); }
    .m { fill: var(--color-text-muted, #595f67); }
    .good { fill: #0b6b52; }
    .bad { fill: #a33f1c; }
    .h { font-weight: 700; }
    .l { font-size: 18px; }
    .s { font-size: 13px; }
    .mono { font-family: ui-monospace, Menlo, Consolas, monospace; font-size: 14px; }
    .line { stroke: var(--color-text-muted, #595f67); stroke-width: 1.8; fill: none; }
    .thick { stroke: #0b6b52; stroke-width: 4; fill: none; }
    .thin { stroke: var(--color-text-muted, #595f67); stroke-width: 1.4; fill: none; }
    .dash { stroke: var(--color-text-muted, #595f67); stroke-width: 1.6; fill: none; stroke-dasharray: 5 4; }
    .flow { stroke: #0b6b52; stroke-width: 2.4; fill: none; }
    .loop { stroke: #0b6b52; stroke-width: 2.4; fill: none; stroke-dasharray: 7 5; }
    .redline { stroke: #a33f1c; stroke-width: 1.8; fill: none; stroke-dasharray: 5 4; }
    .arrow { fill: var(--color-text-muted, #595f67); }
    .arrowg { fill: #0b6b52; }
    .arrowr { fill: #a33f1c; }
    .dot { fill: #0b6b52; }
    .dotm { fill: var(--color-text-muted, #595f67); }
    .ring { fill: var(--color-bg, #ffffff); stroke: var(--color-text, #1d1f22); stroke-width: 2; }
    .sq { fill: var(--color-text, #1d1f22); }
    @media (prefers-color-scheme: dark) {
      .bg { fill: var(--color-bg, #121416); }
      .box { fill: #1a1d20; stroke: #6b737c; }
      .core { fill: #13291f; stroke: #6fd3ae; }
      .obs { fill: #17233a; stroke: #8ab6ff; }
      .ext { fill: #241b33; stroke: #c6a2f5; }
      .os { fill: #301c15; stroke: #f3a184; }
      .hyp { stroke: #8a929b; }
      .zone { stroke: #6b737c; }
      .band { fill: #1b1c19; stroke: #3a3a35; }
      .band2 { fill: #171d27; stroke: #2d3a50; }
      .t { fill: var(--color-text, #e4e6e8); }
      .m { fill: var(--color-text-muted, #a2a9b1); }
      .good { fill: #6fd3ae; }
      .bad { fill: #f3a184; }
      .thick { stroke: #6fd3ae; }
      .thin, .line, .dash { stroke: var(--color-text-muted, #a2a9b1); }
      .flow { stroke: #6fd3ae; }
      .loop { stroke: #6fd3ae; }
      .redline { stroke: #f3a184; }
      .arrow { fill: var(--color-text-muted, #a2a9b1); }
      .arrowg { fill: #6fd3ae; }
      .arrowr { fill: #f3a184; }
      .dot { fill: #6fd3ae; }
      .dotm { fill: var(--color-text-muted, #a2a9b1); }
      .ring { fill: var(--color-bg, #121416); stroke: var(--color-text, #e4e6e8); }
      .sq { fill: var(--color-text, #e4e6e8); }
    }
  </style>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="arrow"/></marker>
    <marker id="ag" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="arrowg"/></marker>
    <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="arrowr"/></marker>
  </defs>
  <rect class="bg" width="720" height="430"/>
  <text x="20" y="28" text-anchor="start" class="t h l">One task, three levels of reasoning effort</text>
  <circle class="core" cx="62" cy="215" r="36"/>
  <text x="62" y="220" text-anchor="middle" class="t h">Agent</text>
  <path class="thin" d="M96 205 C125 205 125 100 165 100 H516" marker-end="url(#a)"/>
  <circle class="dotm" cx="260" cy="100" r="6"/>
  <text x="170" y="80" text-anchor="start" class="m s">Low effort · direct path</text>
  <rect class="box" x="520" y="72" width="180" height="56" rx="8"/>
  <text x="610" y="95.5" text-anchor="middle" class="t h">Fast answer</text>
  <text x="610" y="114.5" text-anchor="middle" class="m s">fine for a simple task</text>
  <path class="line" d="M98 215 H516" marker-end="url(#a)"/>
  <circle class="dotm" cx="250" cy="215" r="6"/>
  <path class="dash" d="M250 215 C270 215 270 178 300 178 H336"/>
  <text x="348" y="183" text-anchor="start" class="bad h l">✕</text>
  <text x="170" y="242" text-anchor="start" class="m s">Medium · weighs one alternative</text>
  <rect class="box" x="520" y="187" width="180" height="56" rx="8"/>
  <text x="610" y="210.5" text-anchor="middle" class="t h">Considered answer</text>
  <text x="610" y="229.5" text-anchor="middle" class="m s">one alternative dropped</text>
  <path class="thick" d="M96 225 C125 225 125 335 165 335 H516" marker-end="url(#ag)"/>
  <circle class="dot" cx="240" cy="335" r="7"/>
  <circle class="dot" cx="330" cy="335" r="7"/>
  <circle class="dot" cx="420" cy="335" r="7"/>
  <path class="dash" d="M240 335 C255 335 262 300 290 300 H322"/>
  <text x="332" y="305" text-anchor="start" class="bad h l">✕</text>
  <path class="dash" d="M330 335 C345 335 352 370 380 370 H412"/>
  <text x="422" y="375" text-anchor="start" class="bad h l">✕</text>
  <circle class="ring" cx="470" cy="335" r="10"/>
  <text x="470" y="340" text-anchor="middle" class="good h">✓</text>
  <text x="140" y="360" text-anchor="start" class="m s">High effort · wide search</text>
  <rect class="core" x="520" y="307" width="180" height="56" rx="8"/>
  <text x="610" y="330.5" text-anchor="middle" class="t h">Verified result</text>
  <text x="610" y="349.5" text-anchor="middle" class="m s">more time and cost</text>
  <text x="20" y="410" text-anchor="start" class="m s">Illustrative. Effort changes how a model reasons, not what evidence exists or what the model can do.</text>
</svg>
