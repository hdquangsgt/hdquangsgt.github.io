<svg xmlns="http://www.w3.org/2000/svg" width="720" height="560" viewBox="0 0 720 560" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="15">
  <style>
    .bg { fill: var(--color-bg, #ffffff); }
    .box { fill: #f5f5f2; stroke: #8a9099; stroke-width: 1.4; }
    .core { fill: #e9f5f0; stroke: #0b6b52; stroke-width: 1.8; }
    .obs { fill: #edf3fc; stroke: #1f5fbf; stroke-width: 1.8; }
    .ext { fill: #f4eefb; stroke: #7a3fb8; stroke-width: 1.8; }
    .os { fill: #fcefea; stroke: #a33f1c; stroke-width: 1.8; }
    .hyp { fill: none; stroke: #8a9099; stroke-width: 1.6; stroke-dasharray: 6 4; }
    .zone { fill: none; stroke: #8a9099; stroke-width: 1.3; stroke-dasharray: 3 4; }
    .band { fill: #f1efe8; stroke: #c9c5b8; stroke-width: 1; }
    .band2 { fill: #ecf1f8; stroke: #b9c6da; stroke-width: 1; }
    .t { fill: var(--color-text, #1d1f22); }
    .m { fill: var(--color-text-muted, #595f67); }
    .good { fill: #0b6b52; }
    .bad { fill: #a33f1c; }
    .h { font-weight: 700; }
    .l { font-size: 18px; }
    .s { font-size: 13px; }
    .mono { font-family: ui-monospace, Menlo, Consolas, monospace; font-size: 14px; }
    .line { stroke: var(--color-text-muted, #595f67); stroke-width: 1.8; fill: none; }
    .thick { stroke: #0b6b52; stroke-width: 4; fill: none; }
    .thin { stroke: var(--color-text-muted, #595f67); stroke-width: 1.4; fill: none; }
    .dash { stroke: var(--color-text-muted, #595f67); stroke-width: 1.6; fill: none; stroke-dasharray: 5 4; }
    .flow { stroke: #0b6b52; stroke-width: 2.4; fill: none; }
    .loop { stroke: #0b6b52; stroke-width: 2.4; fill: none; stroke-dasharray: 7 5; }
    .redline { stroke: #a33f1c; stroke-width: 1.8; fill: none; stroke-dasharray: 5 4; }
    .arrow { fill: var(--color-text-muted, #595f67); }
    .arrowg { fill: #0b6b52; }
    .arrowr { fill: #a33f1c; }
    .dot { fill: #0b6b52; }
    .dotm { fill: var(--color-text-muted, #595f67); }
    .ring { fill: var(--color-bg, #ffffff); stroke: var(--color-text, #1d1f22); stroke-width: 2; }
    .sq { fill: var(--color-text, #1d1f22); }
    @media (prefers-color-scheme: dark) {
      .bg { fill: var(--color-bg, #121416); }
      .box { fill: #1a1d20; stroke: #6b737c; }
      .core { fill: #13291f; stroke: #6fd3ae; }
      .obs { fill: #17233a; stroke: #8ab6ff; }
      .ext { fill: #241b33; stroke: #c6a2f5; }
      .os { fill: #301c15; stroke: #f3a184; }
      .hyp { stroke: #8a929b; }
      .zone { stroke: #6b737c; }
      .band { fill: #1b1c19; stroke: #3a3a35; }
      .band2 { fill: #171d27; stroke: #2d3a50; }
      .t { fill: var(--color-text, #e4e6e8); }
      .m { fill: var(--color-text-muted, #a2a9b1); }
      .good { fill: #6fd3ae; }
      .bad { fill: #f3a184; }
      .thick { stroke: #6fd3ae; }
      .thin, .line, .dash { stroke: var(--color-text-muted, #a2a9b1); }
      .flow { stroke: #6fd3ae; }
      .loop { stroke: #6fd3ae; }
      .redline { stroke: #f3a184; }
      .arrow { fill: var(--color-text-muted, #a2a9b1); }
      .arrowg { fill: #6fd3ae; }
      .arrowr { fill: #f3a184; }
      .dot { fill: #6fd3ae; }
      .dotm { fill: var(--color-text-muted, #a2a9b1); }
      .ring { fill: var(--color-bg, #121416); stroke: var(--color-text, #e4e6e8); }
      .sq { fill: var(--color-text, #e4e6e8); }
    }
  </style>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="arrow"/></marker>
    <marker id="ag" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="arrowg"/></marker>
    <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="arrowr"/></marker>
  </defs>
  <rect class="bg" width="720" height="560"/>
  <rect class="band" x="10" y="50" width="700" height="150" rx="10"/>
  <text x="24" y="70" text-anchor="start" class="t h">Orchestration layer · harness code</text>
  <rect class="band2" x="10" y="216" width="700" height="150" rx="10"/>
  <text x="24" y="236" text-anchor="start" class="t h">Model layer</text>
  <rect class="band" x="10" y="382" width="700" height="130" rx="10"/>
  <text x="24" y="402" text-anchor="start" class="t h">Execution layer · tools</text>
  <rect class="core" x="260" y="4" width="140" height="30" rx="15"/>
  <text x="330" y="24" text-anchor="middle" class="t h">Final answer</text>
  <path class="flow" d="M330 84 L330 36" marker-end="url(#ag)"/>
  <text x="340" y="66" text-anchor="start" class="m s">when a stop rule fires</text>
  <rect class="box" x="30" y="84" width="170" height="68" rx="8"/>
  <text x="115" y="113.5" text-anchor="middle" class="t h">1 · Task + context</text>
  <text x="115" y="132.5" text-anchor="middle" class="m s">prompt, files, history</text>
  <rect class="box" x="250" y="84" width="160" height="68" rx="8"/>
  <text x="330" y="113.5" text-anchor="middle" class="t h">Stop rules</text>
  <text x="330" y="132.5" text-anchor="middle" class="m s">done · limit · budget</text>
  <rect class="obs" x="500" y="84" width="170" height="68" rx="8"/>
  <text x="585" y="113.5" text-anchor="middle" class="t h">5 · Updated context</text>
  <text x="585" y="132.5" text-anchor="middle" class="m s">tool result appended</text>
  <rect class="core" style="stroke-width:3.5" x="30" y="262" width="190" height="86" rx="8"/>
  <text x="125" y="298" text-anchor="middle" class="t h">2 · Reasoning</text>
  <text x="125" y="317" text-anchor="middle" class="m s">inside the model call</text>
  <rect class="core" x="55" y="337" width="140" height="22" rx="11"/>
  <text x="125" y="352" text-anchor="middle" class="good s h">effort acts here</text>
  <polygon class="core" points="330,260 415,305 330,350 245,305"/>
  <text x="330" y="301" text-anchor="middle" class="t h">3 · Decision</text>
  <text x="330" y="319" text-anchor="middle" class="m s">answer or tool?</text>
  <rect class="box" style="stroke-dasharray:6 4" x="250" y="186" width="160" height="46" rx="8"/>
  <text x="330" y="205" text-anchor="middle" class="t h">Verification</text>
  <text x="330" y="223" text-anchor="middle" class="m s">a checkpoint, any layer</text>
  <rect class="ext" x="500" y="418" width="170" height="80" rx="8"/>
  <text x="585" y="453.5" text-anchor="middle" class="t h">4 · Tool execution</text>
  <text x="585" y="472.5" text-anchor="middle" class="m s">search, read, run tests</text>
  <path class="flow" d="M115 152 L115 260" marker-end="url(#ag)"/>
  <path class="flow" d="M220 305 L243 305" marker-end="url(#ag)"/>
  <path class="flow" d="M330 260 L330 234" marker-end="url(#ag)"/>
  <text x="322" y="254" text-anchor="end" class="good s h">answer</text>
  <path class="flow" d="M330 186 L330 154" marker-end="url(#ag)"/>
  <path class="flow" d="M330 350 V458 H498" marker-end="url(#ag)"/>
  <text x="338" y="402" text-anchor="start" class="m s">tool call</text>
  <path class="loop" d="M585 418 L585 154" marker-end="url(#ag)"/>
  <path class="loop" d="M540 152 V176 H190 V260" marker-end="url(#ag)"/>
  <text x="200" y="170" text-anchor="start" class="m s">6 · next decision</text>
  <text x="20" y="548" text-anchor="start" class="m s">Reasoning effort changes step 2 only. Context, tools, stop rules and checks are the system around the model.</text>
</svg>
