<svg xmlns="http://www.w3.org/2000/svg" width="720" height="470" viewBox="0 0 720 470" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="15">
  <style>
    .bg { fill: var(--color-bg, #ffffff); }
    .box { fill: #f5f5f2; stroke: #8a9099; stroke-width: 1.4; }
    .core { fill: #e9f5f0; stroke: #0b6b52; stroke-width: 1.8; }
    .obs { fill: #edf3fc; stroke: #1f5fbf; stroke-width: 1.8; }
    .ext { fill: #f4eefb; stroke: #7a3fb8; stroke-width: 1.8; }
    .os { fill: #fcefea; stroke: #a33f1c; stroke-width: 1.8; }
    .hyp { fill: none; stroke: #8a9099; stroke-width: 1.6; stroke-dasharray: 6 4; }
    .zone { fill: none; stroke: #8a9099; stroke-width: 1.3; stroke-dasharray: 3 4; }
    .band { fill: #f1efe8; stroke: #c9c5b8; stroke-width: 1; }
    .band2 { fill: #ecf1f8; stroke: #b9c6da; stroke-width: 1; }
    .t { fill: var(--color-text, #1d1f22); }
    .m { fill: var(--color-text-muted, #595f67); }
    .good { fill: #0b6b52; }
    .bad { fill: #a33f1c; }
    .h { font-weight: 700; }
    .l { font-size: 18px; }
    .s { font-size: 13px; }
    .mono { font-family: ui-monospace, Menlo, Consolas, monospace; font-size: 14px; }
    .line { stroke: var(--color-text-muted, #595f67); stroke-width: 1.8; fill: none; }
    .thick { stroke: #0b6b52; stroke-width: 4; fill: none; }
    .thin { stroke: var(--color-text-muted, #595f67); stroke-width: 1.4; fill: none; }
    .dash { stroke: var(--color-text-muted, #595f67); stroke-width: 1.6; fill: none; stroke-dasharray: 5 4; }
    .flow { stroke: #0b6b52; stroke-width: 2.4; fill: none; }
    .loop { stroke: #0b6b52; stroke-width: 2.4; fill: none; stroke-dasharray: 7 5; }
    .redline { stroke: #a33f1c; stroke-width: 1.8; fill: none; stroke-dasharray: 5 4; }
    .arrow { fill: var(--color-text-muted, #595f67); }
    .arrowg { fill: #0b6b52; }
    .arrowr { fill: #a33f1c; }
    .dot { fill: #0b6b52; }
    .dotm { fill: var(--color-text-muted, #595f67); }
    .ring { fill: var(--color-bg, #ffffff); stroke: var(--color-text, #1d1f22); stroke-width: 2; }
    .sq { fill: var(--color-text, #1d1f22); }
    @media (prefers-color-scheme: dark) {
      .bg { fill: var(--color-bg, #121416); }
      .box { fill: #1a1d20; stroke: #6b737c; }
      .core { fill: #13291f; stroke: #6fd3ae; }
      .obs { fill: #17233a; stroke: #8ab6ff; }
      .ext { fill: #241b33; stroke: #c6a2f5; }
      .os { fill: #301c15; stroke: #f3a184; }
      .hyp { stroke: #8a929b; }
      .zone { stroke: #6b737c; }
      .band { fill: #1b1c19; stroke: #3a3a35; }
      .band2 { fill: #171d27; stroke: #2d3a50; }
      .t { fill: var(--color-text, #e4e6e8); }
      .m { fill: var(--color-text-muted, #a2a9b1); }
      .good { fill: #6fd3ae; }
      .bad { fill: #f3a184; }
      .thick { stroke: #6fd3ae; }
      .thin, .line, .dash { stroke: var(--color-text-muted, #a2a9b1); }
      .flow { stroke: #6fd3ae; }
      .loop { stroke: #6fd3ae; }
      .redline { stroke: #f3a184; }
      .arrow { fill: var(--color-text-muted, #a2a9b1); }
      .arrowg { fill: #6fd3ae; }
      .arrowr { fill: #f3a184; }
      .dot { fill: #6fd3ae; }
      .dotm { fill: var(--color-text-muted, #a2a9b1); }
      .ring { fill: var(--color-bg, #121416); stroke: var(--color-text, #e4e6e8); }
      .sq { fill: var(--color-text, #e4e6e8); }
    }
  </style>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="arrow"/></marker>
    <marker id="ag" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="arrowg"/></marker>
    <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="arrowr"/></marker>
  </defs>
  <rect class="bg" width="720" height="470"/>
  <text x="20" y="24" text-anchor="start" class="t h">Plausible, but unverified</text>
  <rect class="box" x="20" y="36" width="190" height="56" rx="8"/>
  <text x="115" y="59.5" text-anchor="middle" class="t h">Model proposal</text>
  <text x="115" y="78.5" text-anchor="middle" class="m s">fluent, confident</text>
  <path class="line" d="M210 64 L258 64" marker-end="url(#a)"/>
  <rect class="os" x="260" y="36" width="200" height="56" rx="8"/>
  <text x="360" y="59.5" text-anchor="middle" class="t h">Reads well</text>
  <text x="360" y="78.5" text-anchor="middle" class="m s">no check ran</text>
  <path class="dash" d="M460 64 L508 64" marker-end="url(#a)"/>
  <rect class="hyp" x="510" y="36" width="190" height="56" rx="8"/>
  <text x="605" y="59.5" text-anchor="middle" class="t h">Accepted on trust</text>
  <text x="605" y="78.5" text-anchor="middle" class="m s">status: unknown</text>
  <line class="zone" x1="10" y1="118" x2="710" y2="118"/>
  <text x="20" y="148" text-anchor="start" class="t h">Supported by evidence</text>
  <rect class="core" x="20" y="235" width="150" height="70" rx="8"/>
  <text x="95" y="265.5" text-anchor="middle" class="t h">Model proposal</text>
  <text x="95" y="284.5" text-anchor="middle" class="m s">diff + explanation</text>
  <path class="line" d="M170 270 L214 270"/>
  <path class="line" d="M214 172 L214 400"/>
  <rect class="ext" x="240" y="160" width="240" height="34" rx="6"/>
  <text x="360" y="182" text-anchor="middle" class="t h">Automated tests</text>
  <path class="line" d="M214 177 L238 177" marker-end="url(#a)"/>
  <path class="line" d="M482 177 L504 177"/>
  <rect class="ext" x="240" y="202" width="240" height="34" rx="6"/>
  <text x="360" y="224" text-anchor="middle" class="t h">Type check and lint</text>
  <path class="line" d="M214 219 L238 219" marker-end="url(#a)"/>
  <path class="line" d="M482 219 L504 219"/>
  <rect class="ext" x="240" y="244" width="240" height="34" rx="6"/>
  <text x="360" y="266" text-anchor="middle" class="t h">Review the diff</text>
  <path class="line" d="M214 261 L238 261" marker-end="url(#a)"/>
  <path class="line" d="M482 261 L504 261"/>
  <rect class="ext" x="240" y="286" width="240" height="34" rx="6"/>
  <text x="360" y="308" text-anchor="middle" class="t h">Logs and run output</text>
  <path class="line" d="M214 303 L238 303" marker-end="url(#a)"/>
  <path class="line" d="M482 303 L504 303"/>
  <rect class="ext" x="240" y="328" width="240" height="34" rx="6"/>
  <text x="360" y="350" text-anchor="middle" class="t h">Acceptance criteria</text>
  <path class="line" d="M214 345 L238 345" marker-end="url(#a)"/>
  <path class="line" d="M482 345 L504 345"/>
  <rect class="ext" x="240" y="370" width="240" height="34" rx="6"/>
  <text x="360" y="392" text-anchor="middle" class="t h">Security checks, if relevant</text>
  <path class="line" d="M214 387 L238 387" marker-end="url(#a)"/>
  <path class="line" d="M482 387 L504 387"/>
  <path class="line" d="M504 177 L504 387"/>
  <path class="line" d="M504 232 L538 232" marker-end="url(#a)"/>
  <path class="line" d="M504 338 L538 338" marker-end="url(#a)"/>
  <rect class="core" x="540" y="196" width="160" height="70" rx="8"/>
  <text x="620" y="226.5" text-anchor="middle" class="t h">Pass</text>
  <text x="620" y="245.5" text-anchor="middle" class="m s">evidence recorded</text>
  <rect class="os" x="540" y="304" width="160" height="70" rx="8"/>
  <text x="620" y="334.5" text-anchor="middle" class="t h">Fail</text>
  <text x="620" y="353.5" text-anchor="middle" class="m s">feedback to the model</text>
  <path class="dash" d="M620 374 V432 H95 V307" marker-end="url(#a)"/>
  <text x="110" y="426" text-anchor="start" class="m s">revise and re-check</text>
  <text x="20" y="458" text-anchor="start" class="m s">Check quality is independent of how deep the reasoning looked.</text>
</svg>
