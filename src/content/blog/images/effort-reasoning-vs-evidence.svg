<svg xmlns="http://www.w3.org/2000/svg" width="720" height="440" viewBox="0 0 720 440" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="15">
  <style>
    .bg { fill: var(--color-bg, #ffffff); }
    .box { fill: #f5f5f2; stroke: #8a9099; stroke-width: 1.4; }
    .core { fill: #e9f5f0; stroke: #0b6b52; stroke-width: 1.8; }
    .obs { fill: #edf3fc; stroke: #1f5fbf; stroke-width: 1.8; }
    .ext { fill: #f4eefb; stroke: #7a3fb8; stroke-width: 1.8; }
    .os { fill: #fcefea; stroke: #a33f1c; stroke-width: 1.8; }
    .hyp { fill: none; stroke: #8a9099; stroke-width: 1.6; stroke-dasharray: 6 4; }
    .zone { fill: none; stroke: #8a9099; stroke-width: 1.3; stroke-dasharray: 3 4; }
    .band { fill: #f1efe8; stroke: #c9c5b8; stroke-width: 1; }
    .band2 { fill: #ecf1f8; stroke: #b9c6da; stroke-width: 1; }
    .t { fill: var(--color-text, #1d1f22); }
    .m { fill: var(--color-text-muted, #595f67); }
    .good { fill: #0b6b52; }
    .bad { fill: #a33f1c; }
    .h { font-weight: 700; }
    .l { font-size: 18px; }
    .s { font-size: 13px; }
    .mono { font-family: ui-monospace, Menlo, Consolas, monospace; font-size: 14px; }
    .line { stroke: var(--color-text-muted, #595f67); stroke-width: 1.8; fill: none; }
    .thick { stroke: #0b6b52; stroke-width: 4; fill: none; }
    .thin { stroke: var(--color-text-muted, #595f67); stroke-width: 1.4; fill: none; }
    .dash { stroke: var(--color-text-muted, #595f67); stroke-width: 1.6; fill: none; stroke-dasharray: 5 4; }
    .flow { stroke: #0b6b52; stroke-width: 2.4; fill: none; }
    .loop { stroke: #0b6b52; stroke-width: 2.4; fill: none; stroke-dasharray: 7 5; }
    .redline { stroke: #a33f1c; stroke-width: 1.8; fill: none; stroke-dasharray: 5 4; }
    .arrow { fill: var(--color-text-muted, #595f67); }
    .arrowg { fill: #0b6b52; }
    .arrowr { fill: #a33f1c; }
    .dot { fill: #0b6b52; }
    .dotm { fill: var(--color-text-muted, #595f67); }
    .ring { fill: var(--color-bg, #ffffff); stroke: var(--color-text, #1d1f22); stroke-width: 2; }
    .sq { fill: var(--color-text, #1d1f22); }
    @media (prefers-color-scheme: dark) {
      .bg { fill: var(--color-bg, #121416); }
      .box { fill: #1a1d20; stroke: #6b737c; }
      .core { fill: #13291f; stroke: #6fd3ae; }
      .obs { fill: #17233a; stroke: #8ab6ff; }
      .ext { fill: #241b33; stroke: #c6a2f5; }
      .os { fill: #301c15; stroke: #f3a184; }
      .hyp { stroke: #8a929b; }
      .zone { stroke: #6b737c; }
      .band { fill: #1b1c19; stroke: #3a3a35; }
      .band2 { fill: #171d27; stroke: #2d3a50; }
      .t { fill: var(--color-text, #e4e6e8); }
      .m { fill: var(--color-text-muted, #a2a9b1); }
      .good { fill: #6fd3ae; }
      .bad { fill: #f3a184; }
      .thick { stroke: #6fd3ae; }
      .thin, .line, .dash { stroke: var(--color-text-muted, #a2a9b1); }
      .flow { stroke: #6fd3ae; }
      .loop { stroke: #6fd3ae; }
      .redline { stroke: #f3a184; }
      .arrow { fill: var(--color-text-muted, #a2a9b1); }
      .arrowg { fill: #6fd3ae; }
      .arrowr { fill: #f3a184; }
      .dot { fill: #6fd3ae; }
      .dotm { fill: var(--color-text-muted, #a2a9b1); }
      .ring { fill: var(--color-bg, #121416); stroke: var(--color-text, #e4e6e8); }
      .sq { fill: var(--color-text, #e4e6e8); }
    }
  </style>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="arrow"/></marker>
    <marker id="ag" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="arrowg"/></marker>
    <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="arrowr"/></marker>
  </defs>
  <rect class="bg" width="720" height="440"/>
  <rect class="box" x="20" y="140" width="110" height="64" rx="8"/>
  <text x="75" y="167.5" text-anchor="middle" class="t h">Problem</text>
  <text x="75" y="186.5" text-anchor="middle" class="m s">+ context</text>
  <path class="line" d="M130 172 L158 172" marker-end="url(#a)"/>
  <rect class="zone" x="160" y="50" width="300" height="250" rx="10"/>
  <text x="176" y="78" text-anchor="start" class="t h">More reasoning = wider exploration</text>
  <rect class="hyp" x="180" y="96" width="120" height="42" rx="8"/>
  <text x="240" y="122" text-anchor="middle" class="t h">hypothesis 1</text>
  <rect class="hyp" x="320" y="96" width="120" height="42" rx="8"/>
  <text x="380" y="122" text-anchor="middle" class="t h">hypothesis 2</text>
  <rect class="hyp" x="180" y="152" width="120" height="42" rx="8"/>
  <text x="240" y="178" text-anchor="middle" class="t h">hypothesis 3</text>
  <rect class="hyp" x="320" y="152" width="120" height="42" rx="8"/>
  <text x="380" y="178" text-anchor="middle" class="t h">hypothesis 4</text>
  <rect class="core" x="180" y="216" width="260" height="56" rx="8"/>
  <text x="310" y="239.5" text-anchor="middle" class="t h">Compare and prune</text>
  <text x="310" y="258.5" text-anchor="middle" class="m s">may still choose wrongly</text>
  <path class="line" d="M460 172 L488 172" marker-end="url(#a)"/>
  <rect class="os" x="490" y="140" width="200" height="64" rx="8"/>
  <text x="590" y="167.5" text-anchor="middle" class="t h">Conclusion</text>
  <text x="590" y="186.5" text-anchor="middle" class="m s">not guaranteed correct</text>
  <rect class="obs" x="20" y="346" width="210" height="56" rx="8"/>
  <text x="125" y="369.5" text-anchor="middle" class="t h">Evidence available</text>
  <text x="125" y="388.5" text-anchor="middle" class="m s">logs, code, test output</text>
  <rect class="obs" x="255" y="346" width="210" height="56" rx="8"/>
  <text x="360" y="369.5" text-anchor="middle" class="t h">Model capability</text>
  <text x="360" y="388.5" text-anchor="middle" class="m s">knowledge, skill</text>
  <rect class="obs" x="490" y="346" width="210" height="56" rx="8"/>
  <text x="595" y="369.5" text-anchor="middle" class="t h">Task constraints</text>
  <text x="595" y="388.5" text-anchor="middle" class="m s">time, budget, risk</text>
  <path class="line" d="M125 346 V318 H590 V206" marker-end="url(#a)"/>
  <text x="140" y="310" text-anchor="start" class="m s">also feeds the conclusion</text>
  <path class="line" d="M360 346 L360 318"/>
  <path class="line" d="M595 346 L595 318"/>
  <text x="20" y="428" text-anchor="start" class="bad s h">Missing evidence is a wall: more reasoning cannot cross it.</text>
</svg>
