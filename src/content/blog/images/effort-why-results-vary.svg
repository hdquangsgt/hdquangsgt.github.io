<svg xmlns="http://www.w3.org/2000/svg" width="720" height="500" viewBox="0 0 720 500" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="15">
  <style>
    .bg { fill: var(--color-bg, #ffffff); }
    .box { fill: #f5f5f2; stroke: #8a9099; stroke-width: 1.4; }
    .core { fill: #e9f5f0; stroke: #0b6b52; stroke-width: 1.8; }
    .obs { fill: #edf3fc; stroke: #1f5fbf; stroke-width: 1.8; }
    .ext { fill: #f4eefb; stroke: #7a3fb8; stroke-width: 1.8; }
    .os { fill: #fcefea; stroke: #a33f1c; stroke-width: 1.8; }
    .hyp { fill: none; stroke: #8a9099; stroke-width: 1.6; stroke-dasharray: 6 4; }
    .zone { fill: none; stroke: #8a9099; stroke-width: 1.3; stroke-dasharray: 3 4; }
    .band { fill: #f1efe8; stroke: #c9c5b8; stroke-width: 1; }
    .band2 { fill: #ecf1f8; stroke: #b9c6da; stroke-width: 1; }
    .t { fill: var(--color-text, #1d1f22); }
    .m { fill: var(--color-text-muted, #595f67); }
    .good { fill: #0b6b52; }
    .bad { fill: #a33f1c; }
    .h { font-weight: 700; }
    .l { font-size: 18px; }
    .s { font-size: 13px; }
    .mono { font-family: ui-monospace, Menlo, Consolas, monospace; font-size: 14px; }
    .line { stroke: var(--color-text-muted, #595f67); stroke-width: 1.8; fill: none; }
    .thick { stroke: #0b6b52; stroke-width: 4; fill: none; }
    .thin { stroke: var(--color-text-muted, #595f67); stroke-width: 1.4; fill: none; }
    .dash { stroke: var(--color-text-muted, #595f67); stroke-width: 1.6; fill: none; stroke-dasharray: 5 4; }
    .flow { stroke: #0b6b52; stroke-width: 2.4; fill: none; }
    .loop { stroke: #0b6b52; stroke-width: 2.4; fill: none; stroke-dasharray: 7 5; }
    .redline { stroke: #a33f1c; stroke-width: 1.8; fill: none; stroke-dasharray: 5 4; }
    .arrow { fill: var(--color-text-muted, #595f67); }
    .arrowg { fill: #0b6b52; }
    .arrowr { fill: #a33f1c; }
    .dot { fill: #0b6b52; }
    .dotm { fill: var(--color-text-muted, #595f67); }
    .ring { fill: var(--color-bg, #ffffff); stroke: var(--color-text, #1d1f22); stroke-width: 2; }
    .sq { fill: var(--color-text, #1d1f22); }
    @media (prefers-color-scheme: dark) {
      .bg { fill: var(--color-bg, #121416); }
      .box { fill: #1a1d20; stroke: #6b737c; }
      .core { fill: #13291f; stroke: #6fd3ae; }
      .obs { fill: #17233a; stroke: #8ab6ff; }
      .ext { fill: #241b33; stroke: #c6a2f5; }
      .os { fill: #301c15; stroke: #f3a184; }
      .hyp { stroke: #8a929b; }
      .zone { stroke: #6b737c; }
      .band { fill: #1b1c19; stroke: #3a3a35; }
      .band2 { fill: #171d27; stroke: #2d3a50; }
      .t { fill: var(--color-text, #e4e6e8); }
      .m { fill: var(--color-text-muted, #a2a9b1); }
      .good { fill: #6fd3ae; }
      .bad { fill: #f3a184; }
      .thick { stroke: #6fd3ae; }
      .thin, .line, .dash { stroke: var(--color-text-muted, #a2a9b1); }
      .flow { stroke: #6fd3ae; }
      .loop { stroke: #6fd3ae; }
      .redline { stroke: #f3a184; }
      .arrow { fill: var(--color-text-muted, #a2a9b1); }
      .arrowg { fill: #6fd3ae; }
      .arrowr { fill: #f3a184; }
      .dot { fill: #6fd3ae; }
      .dotm { fill: var(--color-text-muted, #a2a9b1); }
      .ring { fill: var(--color-bg, #121416); stroke: var(--color-text, #e4e6e8); }
      .sq { fill: var(--color-text, #e4e6e8); }
    }
  </style>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="arrow"/></marker>
    <marker id="ag" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="arrowg"/></marker>
    <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="arrowr"/></marker>
  </defs>
  <rect class="bg" width="720" height="500"/>
  <text x="20" y="28" text-anchor="start" class="t h l">Straightforward task</text>
  <rect class="core" x="30" y="50" width="300" height="50" rx="8"/>
  <text x="180" y="80" text-anchor="middle" class="t h">Rename a config key</text>
  <path class="line" d="M180 100 L180 128" marker-end="url(#a)"/>
  <rect class="box" x="30" y="130" width="300" height="50" rx="8"/>
  <text x="180" y="160" text-anchor="middle" class="t h">Edit one file</text>
  <path class="line" d="M180 180 L180 208" marker-end="url(#a)"/>
  <rect class="core" x="30" y="210" width="300" height="50" rx="8"/>
  <text x="180" y="240" text-anchor="middle" class="t h">Check the build passes</text>
  <text x="30" y="292" text-anchor="start" class="m s">One obvious path.</text>
  <text x="30" y="310" text-anchor="start" class="m s">Most settings give the same result.</text>
  <line class="zone" x1="360" y1="14" x2="360" y2="300"/>
  <text x="390" y="28" text-anchor="start" class="t h l">Complex task</text>
  <rect class="os" x="390" y="50" width="310" height="50" rx="8"/>
  <text x="545" y="80" text-anchor="middle" class="t h">Flaky test: fails 1 run in 20</text>
  <rect class="hyp" x="390" y="140" width="96" height="50" rx="8"/>
  <text x="438" y="160.5" text-anchor="middle" class="t h">Race</text>
  <text x="438" y="179.5" text-anchor="middle" class="m s">in setup</text>
  <path class="line" d="M438 100 L438 138" marker-end="url(#a)"/>
  <path class="line" d="M438 190 L438 218" marker-end="url(#a)"/>
  <rect class="hyp" x="497" y="140" width="96" height="50" rx="8"/>
  <text x="545" y="160.5" text-anchor="middle" class="t h">Shared</text>
  <text x="545" y="179.5" text-anchor="middle" class="m s">state</text>
  <path class="line" d="M545 100 L545 138" marker-end="url(#a)"/>
  <path class="line" d="M545 190 L545 218" marker-end="url(#a)"/>
  <rect class="hyp" x="604" y="140" width="96" height="50" rx="8"/>
  <text x="652" y="160.5" text-anchor="middle" class="t h">Timeout</text>
  <text x="652" y="179.5" text-anchor="middle" class="m s">tuning</text>
  <path class="line" d="M652 100 L652 138" marker-end="url(#a)"/>
  <path class="line" d="M652 190 L652 218" marker-end="url(#a)"/>
  <rect class="obs" x="390" y="220" width="310" height="50" rx="8"/>
  <text x="545" y="240.5" text-anchor="middle" class="t h">Evidence</text>
  <text x="545" y="259.5" text-anchor="middle" class="m s">logs, repro, bisect</text>
  <path class="line" d="M545 270 L545 298" marker-end="url(#a)"/>
  <rect class="core" x="390" y="300" width="310" height="40" rx="8"/>
  <text x="545" y="325" text-anchor="middle" class="t h">Cause identified</text>
  <text x="390" y="366" text-anchor="start" class="m s">Several plausible paths.</text>
  <text x="390" y="384" text-anchor="start" class="m s">Depth and evidence both matter.</text>
  <line class="zone" x1="20" y1="388" x2="700" y2="388"/>
  <text x="20" y="416" text-anchor="start" class="t h l">What else changes the outcome</text>
  <rect class="box" x="20" y="428" width="220" height="28" rx="14"/>
  <text x="130" y="447" text-anchor="middle" class="t h">Task complexity</text>
  <rect class="box" x="252" y="428" width="220" height="28" rx="14"/>
  <text x="362" y="447" text-anchor="middle" class="t h">Model behavior</text>
  <rect class="box" x="484" y="428" width="220" height="28" rx="14"/>
  <text x="594" y="447" text-anchor="middle" class="t h">Context available</text>
  <rect class="box" x="20" y="462" width="220" height="28" rx="14"/>
  <text x="130" y="481" text-anchor="middle" class="t h">Tool outputs</text>
  <rect class="box" x="252" y="462" width="220" height="28" rx="14"/>
  <text x="362" y="481" text-anchor="middle" class="t h">Sampling randomness</text>
  <rect class="ext" x="484" y="462" width="220" height="28" rx="14"/>
  <text x="594" y="481" text-anchor="middle" class="t h">Configuration (incl. effort)</text>
</svg>
