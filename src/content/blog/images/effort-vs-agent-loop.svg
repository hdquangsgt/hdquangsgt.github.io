<svg xmlns="http://www.w3.org/2000/svg" width="720" height="480" viewBox="0 0 720 480" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="15">
  <style>
    .bg { fill: var(--color-bg, #ffffff); }
    .box { fill: #f5f5f2; stroke: #8a9099; stroke-width: 1.4; }
    .core { fill: #e9f5f0; stroke: #0b6b52; stroke-width: 1.8; }
    .obs { fill: #edf3fc; stroke: #1f5fbf; stroke-width: 1.8; }
    .ext { fill: #f4eefb; stroke: #7a3fb8; stroke-width: 1.8; }
    .os { fill: #fcefea; stroke: #a33f1c; stroke-width: 1.8; }
    .hyp { fill: none; stroke: #8a9099; stroke-width: 1.6; stroke-dasharray: 6 4; }
    .zone { fill: none; stroke: #8a9099; stroke-width: 1.3; stroke-dasharray: 3 4; }
    .band { fill: #f1efe8; stroke: #c9c5b8; stroke-width: 1; }
    .band2 { fill: #ecf1f8; stroke: #b9c6da; stroke-width: 1; }
    .t { fill: var(--color-text, #1d1f22); }
    .m { fill: var(--color-text-muted, #595f67); }
    .good { fill: #0b6b52; }
    .bad { fill: #a33f1c; }
    .h { font-weight: 700; }
    .l { font-size: 18px; }
    .s { font-size: 13px; }
    .mono { font-family: ui-monospace, Menlo, Consolas, monospace; font-size: 14px; }
    .line { stroke: var(--color-text-muted, #595f67); stroke-width: 1.8; fill: none; }
    .thick { stroke: #0b6b52; stroke-width: 4; fill: none; }
    .thin { stroke: var(--color-text-muted, #595f67); stroke-width: 1.4; fill: none; }
    .dash { stroke: var(--color-text-muted, #595f67); stroke-width: 1.6; fill: none; stroke-dasharray: 5 4; }
    .flow { stroke: #0b6b52; stroke-width: 2.4; fill: none; }
    .loop { stroke: #0b6b52; stroke-width: 2.4; fill: none; stroke-dasharray: 7 5; }
    .redline { stroke: #a33f1c; stroke-width: 1.8; fill: none; stroke-dasharray: 5 4; }
    .arrow { fill: var(--color-text-muted, #595f67); }
    .arrowg { fill: #0b6b52; }
    .arrowr { fill: #a33f1c; }
    .dot { fill: #0b6b52; }
    .dotm { fill: var(--color-text-muted, #595f67); }
    .ring { fill: var(--color-bg, #ffffff); stroke: var(--color-text, #1d1f22); stroke-width: 2; }
    .sq { fill: var(--color-text, #1d1f22); }
    @media (prefers-color-scheme: dark) {
      .bg { fill: var(--color-bg, #121416); }
      .box { fill: #1a1d20; stroke: #6b737c; }
      .core { fill: #13291f; stroke: #6fd3ae; }
      .obs { fill: #17233a; stroke: #8ab6ff; }
      .ext { fill: #241b33; stroke: #c6a2f5; }
      .os { fill: #301c15; stroke: #f3a184; }
      .hyp { stroke: #8a929b; }
      .zone { stroke: #6b737c; }
      .band { fill: #1b1c19; stroke: #3a3a35; }
      .band2 { fill: #171d27; stroke: #2d3a50; }
      .t { fill: var(--color-text, #e4e6e8); }
      .m { fill: var(--color-text-muted, #a2a9b1); }
      .good { fill: #6fd3ae; }
      .bad { fill: #f3a184; }
      .thick { stroke: #6fd3ae; }
      .thin, .line, .dash { stroke: var(--color-text-muted, #a2a9b1); }
      .flow { stroke: #6fd3ae; }
      .loop { stroke: #6fd3ae; }
      .redline { stroke: #f3a184; }
      .arrow { fill: var(--color-text-muted, #a2a9b1); }
      .arrowg { fill: #6fd3ae; }
      .arrowr { fill: #f3a184; }
      .dot { fill: #6fd3ae; }
      .dotm { fill: var(--color-text-muted, #a2a9b1); }
      .ring { fill: var(--color-bg, #121416); stroke: var(--color-text, #e4e6e8); }
      .sq { fill: var(--color-text, #e4e6e8); }
    }
  </style>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="arrow"/></marker>
    <marker id="ag" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="arrowg"/></marker>
    <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="arrowr"/></marker>
  </defs>
  <rect class="bg" width="720" height="480"/>
  <text x="20" y="28" text-anchor="start" class="t h l">A · One model invocation</text>
  <rect class="box" x="30" y="70" width="250" height="54" rx="8"/>
  <text x="155" y="102" text-anchor="middle" class="t h">Input context</text>
  <path class="line" d="M155 124 L155 150" marker-end="url(#a)"/>
  <rect class="core" x="30" y="152" width="250" height="120" rx="8"/>
  <text x="155" y="198" text-anchor="middle" class="t h">Reasoning stage</text>
  <text x="155" y="217" text-anchor="middle" class="m s">internal to the model call</text>
  <text x="155" y="236" text-anchor="middle" class="m s">the effort setting applies here</text>
  <path class="line" d="M155 272 L155 300" marker-end="url(#a)"/>
  <rect class="box" x="30" y="302" width="250" height="54" rx="8"/>
  <text x="155" y="334" text-anchor="middle" class="t h">Output</text>
  <text x="30" y="392" text-anchor="start" class="m s">No tools involved.</text>
  <text x="30" y="410" text-anchor="start" class="m s">Can still be a lot of reasoning.</text>
  <line class="zone" x1="312" y1="14" x2="312" y2="460"/>
  <text x="340" y="28" text-anchor="start" class="t h l">B · Agent loop</text>
  <text x="340" y="48" text-anchor="start" class="m s">external to the model</text>
  <rect class="core" x="380" y="70" width="240" height="54" rx="8"/>
  <text x="500" y="92.5" text-anchor="middle" class="t h">Model call 1</text>
  <text x="500" y="111.5" text-anchor="middle" class="m s">reasoning may be light</text>
  <path class="line" d="M500 124 L500 152" marker-end="url(#a)"/>
  <rect class="ext" x="380" y="154" width="240" height="54" rx="8"/>
  <text x="500" y="176.5" text-anchor="middle" class="t h">Tool call</text>
  <text x="500" y="195.5" text-anchor="middle" class="m s">run the tests</text>
  <path class="line" d="M500 208 L500 236" marker-end="url(#a)"/>
  <rect class="obs" x="380" y="238" width="240" height="54" rx="8"/>
  <text x="500" y="260.5" text-anchor="middle" class="t h">Observation</text>
  <text x="500" y="279.5" text-anchor="middle" class="m s">2 tests fail</text>
  <path class="line" d="M500 292 L500 320" marker-end="url(#a)"/>
  <rect class="core" x="380" y="322" width="240" height="54" rx="8"/>
  <text x="500" y="344.5" text-anchor="middle" class="t h">Model call 2</text>
  <text x="500" y="363.5" text-anchor="middle" class="m s">decide the next step</text>
  <path class="line" d="M500 376 L500 404" marker-end="url(#a)"/>
  <rect class="box" x="380" y="406" width="240" height="54" rx="8"/>
  <text x="500" y="428.5" text-anchor="middle" class="t h">Stop condition met</text>
  <text x="500" y="447.5" text-anchor="middle" class="m s">answer returned</text>
  <path class="dash" d="M620 349 H664 V97 H622" marker-end="url(#a)"/>
  <text x="672" y="208" text-anchor="start" class="m s">repeat</text>
  <text x="672" y="226" text-anchor="start" class="m s">until</text>
  <text x="672" y="244" text-anchor="start" class="m s">stop</text>
</svg>
