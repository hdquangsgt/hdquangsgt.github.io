<svg xmlns="http://www.w3.org/2000/svg" width="720" height="430" viewBox="0 0 720 430" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="13">
  <style>
    .bg { fill: #ffffff; }
    .stage { fill: #f5f5f2; stroke: #8a9099; stroke-width: 1.2; }
    .none { fill: none; stroke: #8a9099; stroke-width: 1.2; stroke-dasharray: 4 4; }
    .gate { fill: #e9f5f0; stroke: #0b6b52; stroke-width: 1.5; }
    .reach { fill: #fcefea; stroke: #a33f1c; stroke-width: 1.5; }
    .t { fill: #1d1f22; }
    .m { fill: #595f67; }
    .h { font-weight: 700; }
    .col { fill: #595f67; font-size: 11px; font-weight: 700; letter-spacing: 0.06em; }
    .line { stroke: #595f67; stroke-width: 1.4; fill: none; }
    .arrow { fill: #595f67; }
    @media (prefers-color-scheme: dark) {
      .bg { fill: #121416; }
      .stage { fill: #1a1d20; stroke: #6b737c; }
      .none { stroke: #6b737c; }
      .gate { fill: #13291f; stroke: #6fd3ae; }
      .reach { fill: #301c15; stroke: #f3a184; }
      .t { fill: #e4e6e8; }
      .m, .col { fill: #a2a9b1; }
      .line { stroke: #a2a9b1; }
      .arrow { fill: #a2a9b1; }
    }
  </style>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" class="arrow"/>
    </marker>
  </defs>
  <rect class="bg" width="720" height="430"/>

  <text x="20" y="26" class="col">SETUP</text>
  <text x="168" y="26" class="col">APPLICATION CHECK</text>
  <text x="352" y="26" class="col">OS SANDBOX</text>
  <text x="536" y="26" class="col">WHAT THE CALL CAN REACH</text>

  <!-- Row 1: Pi default -->
  <text x="20" y="72" class="t h">Pi, default</text>
  <text x="20" y="90" class="m">(1.3.0)</text>
  <rect class="none" x="168" y="48" width="160" height="56" rx="6"/>
  <text x="248" y="72" text-anchor="middle" class="m">none</text>
  <text x="248" y="90" text-anchor="middle" class="m">(no tool_call gate)</text>
  <rect class="none" x="352" y="48" width="160" height="56" rx="6"/>
  <text x="432" y="72" text-anchor="middle" class="m">none</text>
  <text x="432" y="90" text-anchor="middle" class="m">(runs on the host)</text>
  <rect class="reach" x="536" y="48" width="164" height="56" rx="6"/>
  <text x="618" y="72" text-anchor="middle" class="t h">Everything the</text>
  <text x="618" y="90" text-anchor="middle" class="t h">OS user can access</text>
  <path class="line" d="M328 76 H350" marker-end="url(#a)"/>
  <path class="line" d="M512 76 H534" marker-end="url(#a)"/>

  <!-- Row 2: Pi hardened -->
  <text x="20" y="182" class="t h">Pi, hardened</text>
  <text x="20" y="200" class="m">(proposal)</text>
  <rect class="gate" x="168" y="158" width="160" height="56" rx="6"/>
  <text x="248" y="182" text-anchor="middle" class="t">your extension</text>
  <text x="248" y="200" text-anchor="middle" class="m">blocks / confirms</text>
  <rect class="gate" x="352" y="158" width="160" height="56" rx="6"/>
  <text x="432" y="182" text-anchor="middle" class="t">container / VM</text>
  <text x="432" y="200" text-anchor="middle" class="m">only project mounted</text>
  <rect class="stage" x="536" y="158" width="164" height="56" rx="6"/>
  <text x="618" y="182" text-anchor="middle" class="t h">The mounted project</text>
  <text x="618" y="200" text-anchor="middle" class="t h">+ scoped credentials</text>
  <path class="line" d="M328 186 H350" marker-end="url(#a)"/>
  <path class="line" d="M512 186 H534" marker-end="url(#a)"/>

  <!-- Row 3: Claude Code default -->
  <text x="20" y="292" class="t h">Claude Code,</text>
  <text x="20" y="310" class="t h">default mode</text>
  <rect class="gate" x="168" y="268" width="160" height="56" rx="6"/>
  <text x="248" y="292" text-anchor="middle" class="t">rules + mode</text>
  <text x="248" y="310" text-anchor="middle" class="m">prompts outside cwd</text>
  <rect class="none" x="352" y="268" width="160" height="56" rx="6"/>
  <text x="432" y="292" text-anchor="middle" class="m">optional</text>
  <text x="432" y="310" text-anchor="middle" class="m">(sandbox setting)</text>
  <rect class="stage" x="536" y="268" width="164" height="56" rx="6"/>
  <text x="618" y="292" text-anchor="middle" class="t h">OS user's access,</text>
  <text x="618" y="310" text-anchor="middle" class="t h">filtered by approvals</text>
  <path class="line" d="M328 296 H350" marker-end="url(#a)"/>
  <path class="line" d="M512 296 H534" marker-end="url(#a)"/>

  <text x="20" y="370" class="m">Application checks inspect tool names, paths, and command text. An OS sandbox restricts the process itself,</text>
  <text x="20" y="390" class="m">so it also covers child processes and scripts that open files indirectly. The outermost layer that exists</text>
  <text x="20" y="410" class="m">is the one that holds when the inner ones are bypassed.</text>
</svg>
