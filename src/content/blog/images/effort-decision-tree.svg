<svg xmlns="http://www.w3.org/2000/svg" width="720" height="570" viewBox="0 0 720 570" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="15">
  <style>
    .bg { fill: var(--color-bg, #ffffff); }
    .box { fill: #f5f5f2; stroke: #8a9099; stroke-width: 1.4; }
    .core { fill: #e9f5f0; stroke: #0b6b52; stroke-width: 1.8; }
    .obs { fill: #edf3fc; stroke: #1f5fbf; stroke-width: 1.8; }
    .ext { fill: #f4eefb; stroke: #7a3fb8; stroke-width: 1.8; }
    .os { fill: #fcefea; stroke: #a33f1c; stroke-width: 1.8; }
    .hyp { fill: none; stroke: #8a9099; stroke-width: 1.6; stroke-dasharray: 6 4; }
    .zone { fill: none; stroke: #8a9099; stroke-width: 1.3; stroke-dasharray: 3 4; }
    .band { fill: #f1efe8; stroke: #c9c5b8; stroke-width: 1; }
    .band2 { fill: #ecf1f8; stroke: #b9c6da; stroke-width: 1; }
    .t { fill: var(--color-text, #1d1f22); }
    .m { fill: var(--color-text-muted, #595f67); }
    .good { fill: #0b6b52; }
    .bad { fill: #a33f1c; }
    .h { font-weight: 700; }
    .l { font-size: 18px; }
    .s { font-size: 13px; }
    .mono { font-family: ui-monospace, Menlo, Consolas, monospace; font-size: 14px; }
    .line { stroke: var(--color-text-muted, #595f67); stroke-width: 1.8; fill: none; }
    .thick { stroke: #0b6b52; stroke-width: 4; fill: none; }
    .thin { stroke: var(--color-text-muted, #595f67); stroke-width: 1.4; fill: none; }
    .dash { stroke: var(--color-text-muted, #595f67); stroke-width: 1.6; fill: none; stroke-dasharray: 5 4; }
    .flow { stroke: #0b6b52; stroke-width: 2.4; fill: none; }
    .loop { stroke: #0b6b52; stroke-width: 2.4; fill: none; stroke-dasharray: 7 5; }
    .redline { stroke: #a33f1c; stroke-width: 1.8; fill: none; stroke-dasharray: 5 4; }
    .arrow { fill: var(--color-text-muted, #595f67); }
    .arrowg { fill: #0b6b52; }
    .arrowr { fill: #a33f1c; }
    .dot { fill: #0b6b52; }
    .dotm { fill: var(--color-text-muted, #595f67); }
    .ring { fill: var(--color-bg, #ffffff); stroke: var(--color-text, #1d1f22); stroke-width: 2; }
    .sq { fill: var(--color-text, #1d1f22); }
    @media (prefers-color-scheme: dark) {
      .bg { fill: var(--color-bg, #121416); }
      .box { fill: #1a1d20; stroke: #6b737c; }
      .core { fill: #13291f; stroke: #6fd3ae; }
      .obs { fill: #17233a; stroke: #8ab6ff; }
      .ext { fill: #241b33; stroke: #c6a2f5; }
      .os { fill: #301c15; stroke: #f3a184; }
      .hyp { stroke: #8a929b; }
      .zone { stroke: #6b737c; }
      .band { fill: #1b1c19; stroke: #3a3a35; }
      .band2 { fill: #171d27; stroke: #2d3a50; }
      .t { fill: var(--color-text, #e4e6e8); }
      .m { fill: var(--color-text-muted, #a2a9b1); }
      .good { fill: #6fd3ae; }
      .bad { fill: #f3a184; }
      .thick { stroke: #6fd3ae; }
      .thin, .line, .dash { stroke: var(--color-text-muted, #a2a9b1); }
      .flow { stroke: #6fd3ae; }
      .loop { stroke: #6fd3ae; }
      .redline { stroke: #f3a184; }
      .arrow { fill: var(--color-text-muted, #a2a9b1); }
      .arrowg { fill: #6fd3ae; }
      .arrowr { fill: #f3a184; }
      .dot { fill: #6fd3ae; }
      .dotm { fill: var(--color-text-muted, #a2a9b1); }
      .ring { fill: var(--color-bg, #121416); stroke: var(--color-text, #e4e6e8); }
      .sq { fill: var(--color-text, #e4e6e8); }
    }
  </style>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="arrow"/></marker>
    <marker id="ag" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="arrowg"/></marker>
    <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="arrowr"/></marker>
  </defs>
  <rect class="bg" width="720" height="570"/>
  <rect class="os" x="210" y="14" width="300" height="58" rx="8"/>
  <text x="360" y="38.5" text-anchor="middle" class="t h">The agent result is wrong or stuck</text>
  <text x="360" y="57.5" text-anchor="middle" class="m s">What actually failed?</text>
  <path class="line" d="M360 72 V100"/>
  <path class="line" d="M95 100 H625"/>
  <path class="line" d="M95 100 L95 130" marker-end="url(#a)"/>
  <rect class="hyp" x="10" y="132" width="175" height="96" rx="8"/>
  <text x="97.5" y="175.5" text-anchor="middle" class="t h">Shallow analysis</text>
  <text x="97.5" y="194.5" text-anchor="middle" class="m s">facts were available</text>
  <path class="line" d="M95 228 L95 288" marker-end="url(#a)"/>
  <rect class="core" x="10" y="290" width="175" height="84" rx="8"/>
  <text x="97.5" y="327.5" text-anchor="middle" class="t h">Raise effort</text>
  <text x="97.5" y="346.5" text-anchor="middle" class="m s">more careful comparison</text>
  <path class="line" d="M95 374 L95 422" marker-end="url(#a)"/>
  <path class="line" d="M270 100 L270 130" marker-end="url(#a)"/>
  <rect class="hyp" x="185" y="132" width="175" height="96" rx="8"/>
  <text x="272.5" y="175.5" text-anchor="middle" class="t h">Missing facts</text>
  <text x="272.5" y="194.5" text-anchor="middle" class="m s">not in context</text>
  <path class="line" d="M270 228 L270 288" marker-end="url(#a)"/>
  <rect class="ext" x="185" y="290" width="175" height="84" rx="8"/>
  <text x="272.5" y="327.5" text-anchor="middle" class="t h">Add tools or search</text>
  <text x="272.5" y="346.5" text-anchor="middle" class="m s">repo search, fetch docs</text>
  <path class="line" d="M270 374 L270 422" marker-end="url(#a)"/>
  <path class="line" d="M445 100 L445 130" marker-end="url(#a)"/>
  <rect class="hyp" x="360" y="132" width="175" height="96" rx="8"/>
  <text x="447.5" y="166" text-anchor="middle" class="t h">Plan contradicted</text>
  <text x="447.5" y="185" text-anchor="middle" class="m s">a test or log disagrees</text>
  <text x="447.5" y="204" text-anchor="middle" class="m s">with the hypothesis</text>
  <path class="line" d="M445 228 L445 288" marker-end="url(#a)"/>
  <rect class="obs" x="360" y="290" width="175" height="84" rx="8"/>
  <text x="447.5" y="327.5" text-anchor="middle" class="t h">Iterate again</text>
  <text x="447.5" y="346.5" text-anchor="middle" class="m s">revise with new evidence</text>
  <path class="line" d="M445 374 L445 422" marker-end="url(#a)"/>
  <path class="line" d="M620 100 L620 130" marker-end="url(#a)"/>
  <rect class="hyp" x="535" y="132" width="175" height="96" rx="8"/>
  <text x="622.5" y="175.5" text-anchor="middle" class="t h">Task too broad</text>
  <text x="622.5" y="194.5" text-anchor="middle" class="m s">many parts, unfocused</text>
  <path class="line" d="M620 228 L620 288" marker-end="url(#a)"/>
  <rect class="box" x="535" y="290" width="175" height="84" rx="8"/>
  <text x="622.5" y="327.5" text-anchor="middle" class="t h">Decompose the task</text>
  <text x="622.5" y="346.5" text-anchor="middle" class="m s">better orchestration</text>
  <path class="line" d="M620 374 L620 422" marker-end="url(#a)"/>
  <rect class="box" x="10" y="424" width="700" height="72" rx="8"/>
  <text x="360" y="455.5" text-anchor="middle" class="t h">These interventions complement each other</text>
  <text x="360" y="474.5" text-anchor="middle" class="m s">Example: add a search tool, allow one more iteration, and raise effort for the one hard step.</text>
  <text x="10" y="530" text-anchor="start" class="m s">Not sure which one failed? Read the trace and add a verification step before changing settings.</text>
</svg>
