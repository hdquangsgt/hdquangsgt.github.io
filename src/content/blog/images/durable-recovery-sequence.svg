<svg xmlns="http://www.w3.org/2000/svg" width="720" height="500" viewBox="0 0 720 500" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="13">
  <style>
    .bg { fill: var(--color-bg, #ffffff); }
    .box { fill: #f5f5f2; stroke: #8a9099; stroke-width: 1.2; }
    .core { fill: #e9f5f0; stroke: #0b6b52; stroke-width: 1.5; }
    .store { fill: #eaf1fb; stroke: #1f5fae; stroke-width: 1.5; }
    .bad { fill: #fcefea; stroke: #a33f1c; stroke-width: 1.5; }
    .t { fill: var(--color-text, #1d1f22); }
    .m { fill: var(--color-text-muted, #595f67); }
    .halo { paint-order: stroke; stroke: #ffffff; stroke-width: 5px; }
    .h { font-weight: 700; }
    .s { font-size: 11.5px; }
    .mono { font-family: ui-monospace, Menlo, Consolas, monospace; font-size: 12px; }
    .line { stroke: var(--color-text-muted, #595f67); stroke-width: 1.4; fill: none; }
    .dash { stroke: var(--color-text-muted, #595f67); stroke-width: 1.2; fill: none; stroke-dasharray: 4 3; }
    .redline { stroke: #a33f1c; stroke-width: 1.6; fill: none; }
    .arrow { fill: var(--color-text-muted, #595f67); }
    @media (prefers-color-scheme: dark) {
      .bg { fill: var(--color-bg, #121416); }
      .box { fill: #1a1d20; stroke: #6b737c; }
      .core { fill: #13291f; stroke: #6fd3ae; }
      .store { fill: #14233a; stroke: #8db8f0; }
      .bad { fill: #301c15; stroke: #f3a184; }
      .t { fill: var(--color-text, #e4e6e8); }
      .m { fill: var(--color-text-muted, #a2a9b1); }
      .halo { stroke: #121416; }
      .line, .dash { stroke: var(--color-text-muted, #a2a9b1); }
      .redline { stroke: #f3a184; }
      .arrow { fill: var(--color-text-muted, #a2a9b1); }
    }
  </style>
  <defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="arrow"/></marker></defs>
  <rect class="bg" width="720" height="500"/>
  <text class="t h" x="110" y="26" text-anchor="middle">Process A</text>
  <path class="dash" d="M110 38 V484"/>
  <text class="t h" x="300" y="26" text-anchor="middle">Storage</text>
  <path class="dash" d="M300 38 V484"/>
  <text class="t h" x="520" y="26" text-anchor="middle">Process B (after restart)</text>
  <path class="dash" d="M520 38 V484"/>
  <path class="line" d="M110 64 H300" marker-end="url(#a)"/>
  <text class="m s halo" x="205.0" y="58" text-anchor="middle">1 commit user input + task (atomic)</text>
  <path class="line" d="M110 100 H300" marker-end="url(#a)"/>
  <text class="m s halo" x="205.0" y="94" text-anchor="middle">2 checkpoint: model asked for search_logs</text>
  <path class="line" d="M110 136 H300" marker-end="url(#a)"/>
  <text class="m s halo" x="205.0" y="130" text-anchor="middle">3 commit search_logs result</text>
  <path class="line" d="M110 172 H300" marker-end="url(#a)"/>
  <text class="m s halo" x="205.0" y="166" text-anchor="middle">4 commit intent: open_ticket, replay unsafe</text>
  <rect class="bad" x="30" y="196" width="160" height="50" rx="6"/>
  <text class="t h" x="110" y="217" text-anchor="middle">open_ticket runs...</text>
  <text class="m s halo" x="110" y="234" text-anchor="middle">SIGKILL: no result stored</text>
  <text class="m s halo" x="300" y="274" text-anchor="middle">committed: steps 1-4 · not committed: open_ticket outcome</text>
  <path class="line" d="M520 312 H300" marker-end="url(#a)"/>
  <text class="m s halo" x="410.0" y="306" text-anchor="middle">5 Harness.open(same file) + resume()</text>
  <path class="line" d="M300 348 H520" marker-end="url(#a)"/>
  <text class="m s halo" x="410.0" y="342" text-anchor="middle">6 pending generation, tool tasks, intents</text>
  <rect class="core" x="380" y="364" width="280" height="44" rx="6"/>
  <text class="t s" x="520" y="383" text-anchor="middle">search_logs: result committed, not rerun</text>
  <text class="t s" x="520" y="399" text-anchor="middle">open_ticket: replay unsafe, not rerun</text>
  <path class="line" d="M520 436 H300" marker-end="url(#a)"/>
  <text class="m s halo" x="410.0" y="430" text-anchor="middle">7 commit "interrupted" error result</text>
  <path class="line" d="M520 472 H300" marker-end="url(#a)"/>
  <text class="m s halo" x="410.0" y="466" text-anchor="middle">8 model sees it, final answer, submission done</text>
</svg>
