<svg xmlns="http://www.w3.org/2000/svg" width="720" height="480" viewBox="0 0 720 480" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="15">
  <style>
    .bg { fill: var(--color-bg, #ffffff); }
    .box { fill: #f5f5f2; stroke: #8a9099; stroke-width: 1.4; }
    .core { fill: #e9f5f0; stroke: #0b6b52; stroke-width: 1.8; }
    .obs { fill: #edf3fc; stroke: #1f5fbf; stroke-width: 1.8; }
    .ext { fill: #f4eefb; stroke: #7a3fb8; stroke-width: 1.8; }
    .os { fill: #fcefea; stroke: #a33f1c; stroke-width: 1.8; }
    .hyp { fill: none; stroke: #8a9099; stroke-width: 1.6; stroke-dasharray: 6 4; }
    .zone { fill: none; stroke: #8a9099; stroke-width: 1.3; stroke-dasharray: 3 4; }
    .band { fill: #f1efe8; stroke: #c9c5b8; stroke-width: 1; }
    .band2 { fill: #ecf1f8; stroke: #b9c6da; stroke-width: 1; }
    .t { fill: var(--color-text, #1d1f22); }
    .m { fill: var(--color-text-muted, #595f67); }
    .good { fill: #0b6b52; }
    .bad { fill: #a33f1c; }
    .h { font-weight: 700; }
    .l { font-size: 18px; }
    .s { font-size: 13px; }
    .mono { font-family: ui-monospace, Menlo, Consolas, monospace; font-size: 14px; }
    .line { stroke: var(--color-text-muted, #595f67); stroke-width: 1.8; fill: none; }
    .thick { stroke: #0b6b52; stroke-width: 4; fill: none; }
    .thin { stroke: var(--color-text-muted, #595f67); stroke-width: 1.4; fill: none; }
    .dash { stroke: var(--color-text-muted, #595f67); stroke-width: 1.6; fill: none; stroke-dasharray: 5 4; }
    .flow { stroke: #0b6b52; stroke-width: 2.4; fill: none; }
    .loop { stroke: #0b6b52; stroke-width: 2.4; fill: none; stroke-dasharray: 7 5; }
    .redline { stroke: #a33f1c; stroke-width: 1.8; fill: none; stroke-dasharray: 5 4; }
    .arrow { fill: var(--color-text-muted, #595f67); }
    .arrowg { fill: #0b6b52; }
    .arrowr { fill: #a33f1c; }
    .dot { fill: #0b6b52; }
    .dotm { fill: var(--color-text-muted, #595f67); }
    .ring { fill: var(--color-bg, #ffffff); stroke: var(--color-text, #1d1f22); stroke-width: 2; }
    .sq { fill: var(--color-text, #1d1f22); }
    @media (prefers-color-scheme: dark) {
      .bg { fill: var(--color-bg, #121416); }
      .box { fill: #1a1d20; stroke: #6b737c; }
      .core { fill: #13291f; stroke: #6fd3ae; }
      .obs { fill: #17233a; stroke: #8ab6ff; }
      .ext { fill: #241b33; stroke: #c6a2f5; }
      .os { fill: #301c15; stroke: #f3a184; }
      .hyp { stroke: #8a929b; }
      .zone { stroke: #6b737c; }
      .band { fill: #1b1c19; stroke: #3a3a35; }
      .band2 { fill: #171d27; stroke: #2d3a50; }
      .t { fill: var(--color-text, #e4e6e8); }
      .m { fill: var(--color-text-muted, #a2a9b1); }
      .good { fill: #6fd3ae; }
      .bad { fill: #f3a184; }
      .thick { stroke: #6fd3ae; }
      .thin, .line, .dash { stroke: var(--color-text-muted, #a2a9b1); }
      .flow { stroke: #6fd3ae; }
      .loop { stroke: #6fd3ae; }
      .redline { stroke: #f3a184; }
      .arrow { fill: var(--color-text-muted, #a2a9b1); }
      .arrowg { fill: #6fd3ae; }
      .arrowr { fill: #f3a184; }
      .dot { fill: #6fd3ae; }
      .dotm { fill: var(--color-text-muted, #a2a9b1); }
      .ring { fill: var(--color-bg, #121416); stroke: var(--color-text, #e4e6e8); }
      .sq { fill: var(--color-text, #e4e6e8); }
    }
  </style>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="arrow"/></marker>
    <marker id="ag" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="arrowg"/></marker>
    <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="arrowr"/></marker>
  </defs>
  <rect class="bg" width="720" height="480"/>
  <text x="20" y="28" text-anchor="start" class="t h l">Task A</text>
  <text x="20" y="48" text-anchor="start" class="m s">convert JSON to a TypeScript interface</text>
  <rect class="box" x="30" y="76" width="270" height="50" rx="8"/>
  <text x="165" y="106" text-anchor="middle" class="t h">JSON object</text>
  <path class="line" d="M165 126 L165 154" marker-end="url(#a)"/>
  <rect class="box" x="30" y="156" width="270" height="50" rx="8"/>
  <text x="165" y="186" text-anchor="middle" class="t h">Map each field to a type</text>
  <path class="line" d="M165 206 L165 234" marker-end="url(#a)"/>
  <rect class="core" x="30" y="236" width="270" height="50" rx="8"/>
  <text x="165" y="266" text-anchor="middle" class="t h">interface Order { … }</text>
  <text x="30" y="318" text-anchor="start" class="m s">One path. The output can be</text>
  <text x="30" y="336" text-anchor="start" class="m s">checked at a glance.</text>
  <line class="zone" x1="340" y1="14" x2="340" y2="340"/>
  <text x="370" y="28" text-anchor="start" class="t h l">Task B</text>
  <text x="370" y="48" text-anchor="start" class="m s">intermittent race condition, distributed system</text>
  <rect class="os" x="380" y="76" width="320" height="50" rx="8"/>
  <text x="540" y="96.5" text-anchor="middle" class="t h">Symptom</text>
  <text x="540" y="115.5" text-anchor="middle" class="m s">fails 1 request in 200</text>
  <rect class="hyp" x="380" y="160" width="100" height="50" rx="8"/>
  <text x="430" y="180.5" text-anchor="middle" class="t h">Lock</text>
  <text x="430" y="199.5" text-anchor="middle" class="m s">ordering</text>
  <path class="line" d="M430 126 L430 158" marker-end="url(#a)"/>
  <path class="line" d="M430 210 L430 238" marker-end="url(#a)"/>
  <rect class="hyp" x="490" y="160" width="100" height="50" rx="8"/>
  <text x="540" y="180.5" text-anchor="middle" class="t h">Stale</text>
  <text x="540" y="199.5" text-anchor="middle" class="m s">cache</text>
  <path class="line" d="M540 126 L540 158" marker-end="url(#a)"/>
  <path class="line" d="M540 210 L540 238" marker-end="url(#a)"/>
  <rect class="hyp" x="600" y="160" width="100" height="50" rx="8"/>
  <text x="650" y="180.5" text-anchor="middle" class="t h">Duplicate</text>
  <text x="650" y="199.5" text-anchor="middle" class="m s">retry</text>
  <path class="line" d="M650 126 L650 158" marker-end="url(#a)"/>
  <path class="line" d="M650 210 L650 238" marker-end="url(#a)"/>
  <rect class="obs" x="380" y="240" width="320" height="50" rx="8"/>
  <text x="540" y="260.5" text-anchor="middle" class="t h">Cross-component evidence</text>
  <text x="540" y="279.5" text-anchor="middle" class="m s">traces, logs, timing, repro</text>
  <path class="line" d="M540 290 L540 318" marker-end="url(#a)"/>
  <rect class="core" x="380" y="320" width="320" height="44" rx="8"/>
  <text x="540" y="347" text-anchor="middle" class="t h">Narrowed cause, edge cases checked</text>
  <rect class="os" x="20" y="400" width="680" height="62" rx="8"/>
  <text x="360" y="426.5" text-anchor="middle" class="t h">Complexity is not the only axis</text>
  <text x="360" y="445.5" text-anchor="middle" class="m s">A simple task with severe consequences (a production migration) can still deserve care.</text>
</svg>
