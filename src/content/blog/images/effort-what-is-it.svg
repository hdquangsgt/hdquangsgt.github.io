<svg xmlns="http://www.w3.org/2000/svg" width="720" height="430" viewBox="0 0 720 430" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="15">
  <style>
    .bg { fill: var(--color-bg, #ffffff); }
    .box { fill: #f5f5f2; stroke: #8a9099; stroke-width: 1.4; }
    .core { fill: #e9f5f0; stroke: #0b6b52; stroke-width: 1.8; }
    .obs { fill: #edf3fc; stroke: #1f5fbf; stroke-width: 1.8; }
    .ext { fill: #f4eefb; stroke: #7a3fb8; stroke-width: 1.8; }
    .os { fill: #fcefea; stroke: #a33f1c; stroke-width: 1.8; }
    .hyp { fill: none; stroke: #8a9099; stroke-width: 1.6; stroke-dasharray: 6 4; }
    .zone { fill: none; stroke: #8a9099; stroke-width: 1.3; stroke-dasharray: 3 4; }
    .band { fill: #f1efe8; stroke: #c9c5b8; stroke-width: 1; }
    .band2 { fill: #ecf1f8; stroke: #b9c6da; stroke-width: 1; }
    .t { fill: var(--color-text, #1d1f22); }
    .m { fill: var(--color-text-muted, #595f67); }
    .good { fill: #0b6b52; }
    .bad { fill: #a33f1c; }
    .h { font-weight: 700; }
    .l { font-size: 18px; }
    .s { font-size: 13px; }
    .mono { font-family: ui-monospace, Menlo, Consolas, monospace; font-size: 14px; }
    .line { stroke: var(--color-text-muted, #595f67); stroke-width: 1.8; fill: none; }
    .thick { stroke: #0b6b52; stroke-width: 4; fill: none; }
    .thin { stroke: var(--color-text-muted, #595f67); stroke-width: 1.4; fill: none; }
    .dash { stroke: var(--color-text-muted, #595f67); stroke-width: 1.6; fill: none; stroke-dasharray: 5 4; }
    .flow { stroke: #0b6b52; stroke-width: 2.4; fill: none; }
    .loop { stroke: #0b6b52; stroke-width: 2.4; fill: none; stroke-dasharray: 7 5; }
    .redline { stroke: #a33f1c; stroke-width: 1.8; fill: none; stroke-dasharray: 5 4; }
    .arrow { fill: var(--color-text-muted, #595f67); }
    .arrowg { fill: #0b6b52; }
    .arrowr { fill: #a33f1c; }
    .dot { fill: #0b6b52; }
    .dotm { fill: var(--color-text-muted, #595f67); }
    .ring { fill: var(--color-bg, #ffffff); stroke: var(--color-text, #1d1f22); stroke-width: 2; }
    .sq { fill: var(--color-text, #1d1f22); }
    @media (prefers-color-scheme: dark) {
      .bg { fill: var(--color-bg, #121416); }
      .box { fill: #1a1d20; stroke: #6b737c; }
      .core { fill: #13291f; stroke: #6fd3ae; }
      .obs { fill: #17233a; stroke: #8ab6ff; }
      .ext { fill: #241b33; stroke: #c6a2f5; }
      .os { fill: #301c15; stroke: #f3a184; }
      .hyp { stroke: #8a929b; }
      .zone { stroke: #6b737c; }
      .band { fill: #1b1c19; stroke: #3a3a35; }
      .band2 { fill: #171d27; stroke: #2d3a50; }
      .t { fill: var(--color-text, #e4e6e8); }
      .m { fill: var(--color-text-muted, #a2a9b1); }
      .good { fill: #6fd3ae; }
      .bad { fill: #f3a184; }
      .thick { stroke: #6fd3ae; }
      .thin, .line, .dash { stroke: var(--color-text-muted, #a2a9b1); }
      .flow { stroke: #6fd3ae; }
      .loop { stroke: #6fd3ae; }
      .redline { stroke: #f3a184; }
      .arrow { fill: var(--color-text-muted, #a2a9b1); }
      .arrowg { fill: #6fd3ae; }
      .arrowr { fill: #f3a184; }
      .dot { fill: #6fd3ae; }
      .dotm { fill: var(--color-text-muted, #a2a9b1); }
      .ring { fill: var(--color-bg, #121416); stroke: var(--color-text, #e4e6e8); }
      .sq { fill: var(--color-text, #e4e6e8); }
    }
  </style>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="arrow"/></marker>
    <marker id="ag" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="arrowg"/></marker>
    <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="arrowr"/></marker>
  </defs>
  <rect class="bg" width="720" height="430"/>
  <text x="20" y="28" text-anchor="start" class="t h">Public API (documented)</text>
  <rect class="box" x="20" y="170" width="160" height="70" rx="8"/>
  <text x="100" y="200.5" text-anchor="middle" class="t h">Task + context</text>
  <text x="100" y="219.5" text-anchor="middle" class="m s">input</text>
  <rect class="obs" x="20" y="56" width="160" height="70" rx="8"/>
  <text x="100" y="86.5" text-anchor="middle" class="t h">Effort setting</text>
  <text x="100" y="105.5" text-anchor="middle" class="m s">e.g. low … high</text>
  <path class="line" d="M180 205 L208 205" marker-end="url(#a)"/>
  <path class="line" d="M180 91 L208 91" marker-end="url(#a)"/>
  <rect class="zone" x="210" y="40" width="300" height="320" rx="10"/>
  <text x="226" y="66" text-anchor="start" class="t h">Model inference</text>
  <text x="226" y="84" text-anchor="start" class="m s">internals vary and are not exposed</text>
  <rect class="hyp" x="236" y="102" width="248" height="54" rx="8"/>
  <text x="360" y="134" text-anchor="middle" class="t h">Reasoning behavior ?</text>
  <rect class="hyp" x="236" y="172" width="248" height="54" rx="8"/>
  <text x="360" y="204" text-anchor="middle" class="t h">Computation spent ?</text>
  <rect class="hyp" x="236" y="242" width="248" height="54" rx="8"/>
  <text x="360" y="274" text-anchor="middle" class="t h">Other inference choices ?</text>
  <text x="226" y="326" text-anchor="start" class="m s">Effort may influence any of these.</text>
  <text x="226" y="344" text-anchor="start" class="m s">It is not a fixed token count.</text>
  <text x="535" y="28" text-anchor="start" class="t h">Public API (documented)</text>
  <rect class="core" x="535" y="56" width="170" height="66" rx="8"/>
  <text x="620" y="84.5" text-anchor="middle" class="t h">Answer</text>
  <text x="620" y="103.5" text-anchor="middle" class="m s">final output</text>
  <rect class="obs" x="535" y="150" width="170" height="70" rx="8"/>
  <text x="620" y="180.5" text-anchor="middle" class="t h">Reasoning summary</text>
  <text x="620" y="199.5" text-anchor="middle" class="m s">opt-in, not raw trace</text>
  <rect class="box" x="535" y="248" width="170" height="70" rx="8"/>
  <text x="620" y="278.5" text-anchor="middle" class="t h">Usage report</text>
  <text x="620" y="297.5" text-anchor="middle" class="m s">reasoning tokens billed</text>
  <path class="line" d="M512 89 L533 89" marker-end="url(#a)"/>
  <path class="line" d="M512 185 L533 185" marker-end="url(#a)"/>
  <path class="line" d="M512 283 L533 283" marker-end="url(#a)"/>
  <text x="20" y="400" text-anchor="start" class="m s">The "?" boxes are deliberately unspecified: the API setting does not expose what happens inside.</text>
</svg>
