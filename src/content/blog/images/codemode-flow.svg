<svg xmlns="http://www.w3.org/2000/svg" width="720" height="410" viewBox="0 0 720 410" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="13">
  <style>
    .bg { fill: var(--color-bg, #ffffff); }
    .box { fill: #f5f5f2; stroke: #8a9099; stroke-width: 1.2; }
    .core { fill: #e9f5f0; stroke: #0b6b52; stroke-width: 1.5; }
    .gdash { fill: none; stroke: #0b6b52; stroke-width: 1.5; stroke-dasharray: 6 4; }
    .ext { fill: #f4eefb; stroke: #7a3fb8; stroke-width: 1.5; }
    .os { fill: #fcefea; stroke: #a33f1c; stroke-width: 1.5; }
    .none { fill: none; stroke: #8a9099; stroke-width: 1.2; stroke-dasharray: 4 4; }
    .frame { fill: none; stroke: #b4b9bf; stroke-width: 1; stroke-dasharray: 3 3; }
    .t { fill: var(--color-text, #1d1f22); }
    .m { fill: var(--color-text-muted, #595f67); }
    .h { font-weight: 700; }
    .s { font-size: 11.5px; }
    .mono { font-family: ui-monospace, Menlo, Consolas, monospace; font-size: 12px; }
    .line { stroke: var(--color-text-muted, #595f67); stroke-width: 1.4; fill: none; }
    .dash { stroke: var(--color-text-muted, #595f67); stroke-width: 1.2; fill: none; stroke-dasharray: 4 3; }
    .arrow { fill: var(--color-text-muted, #595f67); }
    @media (prefers-color-scheme: dark) {
      .bg { fill: var(--color-bg, #121416); }
      .box { fill: #1a1d20; stroke: #6b737c; }
      .core { fill: #13291f; stroke: #6fd3ae; }
      .gdash { stroke: #6fd3ae; }
      .ext { fill: #241b33; stroke: #c6a2f5; }
      .os { fill: #301c15; stroke: #f3a184; }
      .none { stroke: #6b737c; }
      .frame { stroke: #4a5159; }
      .t { fill: var(--color-text, #e4e6e8); }
      .m { fill: var(--color-text-muted, #a2a9b1); }
      .line, .dash { stroke: var(--color-text-muted, #a2a9b1); }
      .arrow { fill: var(--color-text-muted, #a2a9b1); }
    }
  </style>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" class="arrow"/>
    </marker>
  </defs>
  <rect class="bg" width="720" height="410"/>
  <text x="20" y="24" text-anchor="start" class="t h">Ordinary tool calling: every full result enters the context</text>
  <rect class="ext" x="20" y="38" width="680" height="62" rx="6"/>
  <rect class="box" x="32" y="50" width="100" height="38" rx="6"/>
  <text x="82.0" y="74.0" text-anchor="middle" class="t h mono">call 1</text>
  <rect class="os" x="143" y="50" width="100" height="38" rx="6"/>
  <text x="193.0" y="74.0" text-anchor="middle" class="t h mono">result 1</text>
  <rect class="box" x="254" y="50" width="100" height="38" rx="6"/>
  <text x="304.0" y="74.0" text-anchor="middle" class="t h mono">call 2</text>
  <rect class="os" x="365" y="50" width="100" height="38" rx="6"/>
  <text x="415.0" y="74.0" text-anchor="middle" class="t h mono">result 2</text>
  <rect class="box" x="476" y="50" width="100" height="38" rx="6"/>
  <text x="526.0" y="74.0" text-anchor="middle" class="t h mono">call 3</text>
  <rect class="os" x="587" y="50" width="100" height="38" rx="6"/>
  <text x="637.0" y="74.0" text-anchor="middle" class="t h mono">result 3</text>
  <text x="20" y="120" text-anchor="start" class="m s">Three round trips, three full results in context. Each step is another model request.</text>
  <text x="20" y="160" text-anchor="start" class="t h">Code Mode: one script, only its output comes back</text>
  <rect class="box" x="20" y="176" width="130" height="80" rx="6"/>
  <text x="85.0" y="211.0" text-anchor="middle" class="t h">Model</text>
  <text x="85.0" y="229.0" text-anchor="middle" class="m s">writes one</text>
  <text x="85.0" y="247.0" text-anchor="middle" class="m s">JavaScript script</text>
  <path class="line" d="M152 216 H178" marker-end="url(#a)"/>
  <rect class="core" x="180" y="176" width="300" height="124" rx="6"/>
  <text x="194" y="196" text-anchor="start" class="m s">QuickJS sandbox (illustrative)</text>
  <text x="194" y="220" text-anchor="start" class="t mono">const r = await Promise.allSettled([</text>
  <text x="194" y="238" text-anchor="start" class="t mono">  tools.read(a), tools.grep(b) ]);</text>
  <text x="194" y="256" text-anchor="start" class="t mono">// filter and batch here</text>
  <text x="194" y="274" text-anchor="start" class="t mono">return summarize(r);</text>
  <path class="line" d="M482 238 H518" marker-end="url(#a)"/>
  <rect class="box" x="520" y="190" width="180" height="100" rx="6"/>
  <text x="610.0" y="235.0" text-anchor="middle" class="t h">Script output only</text>
  <text x="610.0" y="253.0" text-anchor="middle" class="m s">default cap: 10,000 tokens</text>
  <text x="610.0" y="271.0" text-anchor="middle" class="m s">partial output kept on failure</text>
  <text x="20" y="330" text-anchor="start" class="m s">Sandbox: no Node APIs, file system, network or timers; reach = the tools it is given, plus models.</text>
  <text x="20" y="348" text-anchor="start" class="m s">Limits: 256 MB memory, no nested codemode scripts, two codemode workers per Pi process.</text>
  <text x="20" y="366" text-anchor="start" class="m s">Tool calls made before a failure are not undone. Intermediate results never reach the model.</text>
</svg>
